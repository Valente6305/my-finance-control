<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Intelligence v7 — My Finance Control</title><style>
:root{font:15px system-ui,sans-serif;color:#14283c;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:white;padding:22px 18px}header>div,main{max-width:1050px;margin:auto}h1{margin:0 0 7px}main{padding:20px 14px 50px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dbe3ec;border-radius:12px;padding:18px;margin:0 0 14px}.muted{color:#607387;font-size:.9rem}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #edf0f3;flex-wrap:wrap}.row:last-child{border:0}label{display:block;margin:10px 0}input{display:block;width:100%;padding:10px;border:1px solid #acbaca;border-radius:7px;margin-top:4px;font:inherit}button,.btn{border:0;border-radius:8px;background:#10243a;color:white;padding:11px 15px;cursor:pointer;font:inherit;display:inline-block;text-decoration:none}button:disabled{opacity:.5}a{color:#145d87}strong.big{font-size:1.55rem}table{border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #e6eaf0}.scroll{overflow:auto}.ok{color:#16714c}.warn{color:#a15c08}.bad{color:#aa2531}.bar{height:10px;background:#e3e9ee;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#21835e}#notice{min-height:22px;font-weight:600}
</style></head><body><header><div><h1>◈ Financial Intelligence v7</h1><div>Património líquido · amortização de dívidas · projeção · saúde financeira</div></div></header><main><p><a href="./index.html">← Overview</a> · <a href="./financial-intelligence.html">Financial Intelligence v6</a> · <a href="./bank-accounts.html">Contas bancárias</a></p><p id="notice" role="status"></p><div id="app"></div></main><script>
'use strict';
const KEY='finance-control-public-v2',V7='finance-intelligence-v7-settings',V6='finance-intelligence-v6-settings';
const n=v=>Math.max(0,Number(v)||0),money=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(v)||0),pct=v=>(100*v).toFixed(1)+'%';
const read=(k)=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const nowMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=(a,b)=>'<div class="row"><span>'+a+'</span><strong>'+b+'</strong></div>';
const box=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';
const field=(key,label,value,step='0.01')=>'<label>'+label+'<input data-v7="'+key+'" type="number" min="0" step="'+step+'" value="'+(Number(value)||0)+'"></label>';
function importedTransactions(s){const map=new Map();for(const t of s.transactions||[]){if(!t||!/^\d{4}-\d{2}-\d{2}/.test(String(t.date||''))||!Number.isFinite(Number(t.amount)))continue;const key=t.import_id||[t.date,t.account,t.description,t.amount].join('|');if(!map.has(key))map.set(key,t)}return [...map.values()]}
function isTransfer(t){return t.category==='Transfer'||/TRANSFERENCIA ENTRE CONTAS|REVOLUT TOP UP|TRANSFER TO OWN/i.test(String(t.description||''))}
function isDebt(t){return t.category==='Debt payment'||/CREDIBOM|CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/i.test(String(t.description||''))}
function budget(s){const p=read(V6);return Object.values(p.budgetHistory?.[nowMonth()]?.categories||{Alimentação:s.food,Transportes:s.transport,Comunicações:s.meo,'Serviços bancários':s.bankSubs,Outros:s.misc,...(p.budgets||{})}).reduce((a,v)=>a+n(v),0)}
function loan(balance,annual,payment,extra=0){let b=n(balance),rate=n(annual)/1200,regular=n(payment),additional=n(extra);if(b===0)return {months:0,interest:0,total:0,valid:true};if(regular+additional<=b*rate)return {valid:false};let interest=0,months=0;while(b>0.005&&months<1200){const i=b*rate;interest+=i;b=Math.max(0,b+i-Math.min(b+i,regular+additional));months++}return {months,interest,total:balance+interest,valid:months<1200}}
function evaluate(s,c,tx){const hasBank=!!s.bankSync;const b=budget(s),mm=nowMonth();const expense=tx.filter(t=>String(t.date).startsWith(mm)&&Number(t.amount)<0&&!isTransfer(t)&&!isDebt(t)).reduce((a,t)=>a-Number(t.amount),0);const reserve=n(s.reserve),liquid=n(c.cash),debts=n(c.car)+n(c.card);const checks=[
 {label:'Orçamento mensal',weight:25,score:b>0&&hasBank?Math.max(0,Math.min(1,1-(Math.max(0,expense-b)/b))):null,detail:b>0?money(expense)+' / '+money(b):'Orçamento não definido'},
 {label:'Poupança mensal',weight:25,score:null,detail:'Sem saldo inicial/final conciliado para medir poupança efetiva'},
 {label:'Endividamento',weight:20,score:n(s.salary)>0&&c.carPay+c.cardPay>0?Math.max(0,1-(c.carPay+c.cardPay)/n(s.salary)/.4):null,detail:'Rácio prestações / salário; pontuação indicativa'},
 {label:'Reserva de emergência',weight:20,score:reserve>0?Math.min(1,liquid/reserve):null,detail:money(liquid)+' / '+money(reserve)},
 {label:'Regularidade de pagamentos',weight:10,score:null,detail:'Exige conciliação bancária mensal completa'}
 ];const known=checks.filter(x=>x.score!==null),weight=known.reduce((a,x)=>a+x.weight,0);return {checks,score:weight?known.reduce((a,x)=>a+x.weight*x.score,0)/weight*100:null,coverage:weight,expense,b,hasBank,debts}}
function safeAmortization(c,s,p){
 const reserve=n(s.reserve)||5000;
 const cushion=n(p.safetyBuffer??s.workingBuffer??0);
 const days=n(p.daysUntilSalary);
 const remainingDays=days>0?Math.min(31,days):null;
 const essential=n(c.expenses)+n(c.carPay)+n(c.cardPay);
 const upcoming=remainingDays===null?null:essential*remainingDays/30;
 const available=upcoming===null?null:Math.max(0,c.cash-reserve-cushion-upcoming);
 const safe=available===null?null:Math.min(c.car,available);
 const after=n(c.cash)-n(c.extra);
 const compliant=upcoming!==null&&n(c.extra)<=safe&&after>=reserve+cushion+upcoming;
 return {reserve,cushion,remainingDays,upcoming,available,safe,compliant,after};
}
function render(){
 const s=read(KEY),p=read(V7),tx=importedTransactions(s),c={cash:n(p.cash??s.balance),other:n(p.other),car:n(p.car??s.debtEstimates?.car?.balance??s.carBalance),card:n(p.card??s.debtEstimates?.card?.balance??s.cardBalance),carAPR:n(p.carAPR??s.carAPR),cardAPR:n(p.cardAPR??s.cardAPR),carPay:n(p.carPay??s.carRegular??210.74),cardPay:n(p.cardPay??s.cardRegular??231.25),extra:n(p.extra),income:n(p.income??s.salary),expenses:n(p.expenses??budget(s))};
 const net=c.cash+c.other-c.car-c.card,health=evaluate(s,c,tx),base=loan(c.car,c.carAPR,c.carPay),accelerated=loan(Math.max(0,c.car-c.extra),c.carAPR,c.carPay),saved=base.valid&&accelerated.valid?base.interest-accelerated.interest:null;
 const monthlyNet=c.income-c.expenses-c.carPay-c.cardPay,hasInputs=c.income>0&&c.expenses>0,prudence=safeAmortization(c,s,p);
 let html=box('Património líquido', '<div class="grid">'+[['Ativos registados',money(c.cash+c.other)],['Passivos registados',money(c.car+c.card)],['Património líquido estimado',money(net)]].map(x=>'<div>'+row(x[0],'<span class="big">'+x[1]+'</span>')+'</div>').join('')+'</div><p class="muted">Os valores são estimativas editáveis. Não somar saldos de contas já incluídos em “Dinheiro em contas”. O saldo do cartão é uma dívida, não um ativo. A reserva de emergência faz parte do dinheiro existente, não é somada novamente.</p>');
 html+=box('Confirmar valores de referência', '<div class="grid">'+field('cash','Dinheiro total nas contas (€)',c.cash)+field('other','Outros ativos líquidos (€)',c.other)+field('car','Capital em dívida — Credibom (€)',c.car)+field('card','Dívida — Caixa Classic (€)',c.card)+field('carAPR','TAEG/TAN anual usada na simulação (%)',c.carAPR)+field('cardAPR','Taxa anual do cartão (%)',c.cardAPR)+field('carPay','Prestação mensal Credibom (€)',c.carPay)+field('cardPay','Pagamento mensal do cartão (€)',c.cardPay)+'</div><button id="save">Guardar valores de referência</button><p class="muted">Não modifica saldos bancários, prestações confirmadas nem transações. A taxa usada na simulação deve ser a TAN nominal contratual, não a TAEG.</p>');
 html+=box('Simulador de amortização Credibom',field('extra','Amortização antecipada única (€)',c.extra)+'<button id="simulate">Simular</button>'+row('Sem amortização extra',base.valid?base.months+' meses · juros estimados '+money(base.interest):'Prestação insuficiente para amortizar')+row('Com amortização de '+money(c.extra),accelerated.valid?accelerated.months+' meses · juros estimados '+money(accelerated.interest):'Prestação insuficiente')+row('Poupança bruta estimada de juros',saved===null?'Indisponível':money(saved))+'<p class="muted">Modelo de prestações constantes, taxa fixa e amortização imediata, mantendo a prestação e reduzindo o prazo. Não inclui seguros, comissões, impostos, alterações de taxa ou regras contratuais. Não constitui uma proposta de liquidação.</p>');
 html+=box('Amortização prudente · proteção da reserva', '<p class="muted">Cálculo conservador baseado no dinheiro disponível, reserva protegida e despesas estimadas até ao próximo salário. Introduz o número real de dias até receberes o salário; sem essa informação não é apresentada uma recomendação numérica.</p><div class="grid">'+field('daysUntilSalary','Dias até ao próximo salário (1–31)',p.daysUntilSalary||0,'1')+field('safetyBuffer','Margem adicional de segurança (€)',p.safetyBuffer??s.workingBuffer??0)+'</div><button id="prudenceSave">Atualizar avaliação</button>'+row('Dinheiro disponível',money(c.cash))+row('Reserva protegida',money(prudence.reserve))+row('Margem de segurança',money(prudence.cushion))+row('Despesas estimadas até ao salário',prudence.upcoming===null?'⚪ Indicar dias até ao salário':money(prudence.upcoming))+row('Máximo prudente estimado',prudence.safe===null?'⚪ Dados insuficientes':money(prudence.safe))+row('Amortização simulada',money(c.extra))+row('Situação',prudence.safe===null?'⚪ Não avaliada':prudence.compliant?'🟢 Dentro do limite estimado':'🔴 Acima do limite prudente')+'<p class="muted">Estimativa proporcional das despesas mensais, incluindo prestações. Não confirma o calendário real de débitos, despesas extraordinárias, comissões de amortização ou saldos em trânsito. O limite é um teto indicativo, não uma ordem de pagamento. Se a reserva estiver incompleta, a margem disponível diminui automaticamente.</p>');
 html+=box('Previsão de tesouraria · 12 meses','<div class="grid">'+field('income','Rendimento líquido mensal de referência (€)',c.income)+field('expenses','Despesas mensais previstas sem prestações (€)',c.expenses)+'</div><button id="forecast">Atualizar previsão</button>'+(hasInputs?'<div class="scroll"><table><thead><tr><th>Mês</th><th>Conservador</th><th>Base</th><th>Otimista</th></tr></thead><tbody>'+Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i+1);const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return '<tr><td>'+m+'</td>'+[1.15,1,.9].map(f=>'<td>'+money(c.cash+(i+1)*(c.income-c.expenses*f-c.carPay-c.cardPay))+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>':'<p class="muted">Define rendimento e despesas para obter a projeção.</p>')+'<p class="muted">Projeção simplificada do dinheiro disponível, não do património. Pressupõe salário e prestações constantes durante 12 meses, sem 13.º/14.º mês, juros, imprevistos ou amortização final do empréstimo. Não é previsão de saldo bancário real.</p>');
 html+=box('Indicador de saúde financeira · experimental',row('Pontuação parcial',health.score===null?'Dados insuficientes':health.score.toFixed(0)+'/100')+row('Cobertura dos indicadores',health.coverage+'%')+health.checks.map(x=>row(esc(x.label)+' ('+x.weight+'%)',x.score===null?'⚪ Não avaliado':(x.score*100).toFixed(0)+'%')).join('')+'<p class="muted">Índice interno exploratório, não validado cientificamente nem comparável a classificações de crédito. A pontuação usa apenas os indicadores com dados disponíveis. Não interpretar uma pontuação parcial como avaliação global.</p>');
 const history=p.netWorthHistory||{};html+=box('Histórico mensal do património',row('Registos guardados',String(Object.keys(history).length))+'<button id="snapshot">Guardar fotografia financeira deste mês</button>'+(Object.keys(history).length?'<div class="scroll"><table><thead><tr><th>Mês</th><th>Ativos</th><th>Dívidas</th><th>Património líquido</th></tr></thead><tbody>'+Object.entries(history).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,v])=>'<tr><td>'+esc(m)+'</td><td>'+money(v.assets)+'</td><td>'+money(v.debts)+'</td><td>'+money(v.net)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Ainda sem registos. O histórico é guardado apenas quando confirmas os valores.</p>')+'<p class="muted">O registo é manual para evitar arquivar como definitivos saldos ou dívidas desatualizados.</p>');
 document.getElementById('app').innerHTML=html;
 const save=()=>{const values={};document.querySelectorAll('[data-v7]').forEach(el=>values[el.dataset.v7]=n(el.value));write(V7,{...read(V7),...values});render();document.getElementById('notice').textContent='Valores guardados neste dispositivo.'};
 document.getElementById('prudenceSave').onclick=save;document.getElementById('save').onclick=save;document.getElementById('simulate').onclick=save;document.getElementById('forecast').onclick=save;
 document.getElementById('snapshot').onclick=()=>{const latest=read(V7),v={cash:n(latest.cash??c.cash),other:n(latest.other??c.other),car:n(latest.car??c.car),card:n(latest.card??c.card)};const assets=v.cash+v.other,debts=v.car+v.card,key=nowMonth();if(!confirm('Guardar os valores de '+key+' como fotografia financeira? Verifica primeiro se saldos e dívidas estão atualizados.'))return;write(V7,{...latest,netWorthHistory:{...(latest.netWorthHistory||{}),[key]:{assets,debts,net:assets-debts,recordedAt:new Date().toISOString()}}});render();document.getElementById('notice').textContent='Fotografia financeira guardada.'};
}
render();window.addEventListener('pageshow',render);window.addEventListener('storage',e=>{if(e.key===KEY||e.key===V7)render()});
</script></body></html>
