<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Intelligence v7 — My Finance Control</title><style>
:root{font:15px system-ui,sans-serif;color:#14283c;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:#fff;padding:22px 18px}header>div,main{max-width:1080px;margin:auto}h1{margin:0 0 6px}main{padding:18px 14px 50px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:12px;padding:18px;margin:0 0 14px}.muted{color:#607387;font-size:.89rem}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #edf0f3;flex-wrap:wrap}.row:last-child{border:0}label{display:block;margin:10px 0}input,select{display:block;width:100%;padding:9px;border:1px solid #acbaca;border-radius:7px;margin-top:4px;font:inherit}button,.btn{border:0;border-radius:8px;background:#10243a;color:#fff;padding:10px 13px;cursor:pointer;font:inherit;display:inline-block;text-decoration:none}a{color:#145d87}.ok{color:#16714c}.warn{color:#a15c08}.bad{color:#aa2531}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #e6eaf0}.bar{height:10px;background:#e3e9ee;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#21835e}.bar .over{background:#b42332}#notice{min-height:22px;font-weight:650}.danger{background:#9f2632}
</style></head><body><header><div><h1>◈ Financial Intelligence v7</h1><div>Revisão mensal · património líquido · dívidas · previsão · saúde financeira</div></div></header><main><p><a href="./index.html">← Overview</a> · <a href="./bank-accounts.html">Contas bancárias</a></p><p id="notice" role="status"></p><div id="app"></div></main><script>
'use strict';
const KEY='finance-control-public-v2',V7='finance-intelligence-v7-settings',V6='finance-intelligence-v6-settings';
const n=v=>Math.max(0,Number(v)||0),eur=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(v)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),today=()=>new Date().toISOString().slice(0,10),mmNow=()=>today().slice(0,7),month=d=>String(d||'').slice(0,7),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const categories=['Alimentação','Transportes','Comunicações','Serviços bancários','Habitação e serviços','Saúde','Família','Lazer','Outros'];
const rules=[[/CONTINENTE|PINGO DOCE|LIDL|ALDI|INTERMARCHE|AUCHAN|SUPERMERCADO|MERCADO /,'Alimentação'],[/COMBUST|GALP|REPSOL|BP |CEPSA|POSTO /,'Transportes'],[/MEO|NOS COMUNIC|VODAFONE|TELECOM/,'Comunicações'],[/COMISSAO|MANUTENCAO CONTA|ANUIDADE/,'Serviços bancários'],[/RENDA|ELECTRIC|ELETRIC|EDP|AGUA|ENERGIA/,'Habitação e serviços'],[/FARMAC|CLINIC|HOSPITAL/,'Saúde']];
const row=(a,b)=>'<div class="row"><span>'+a+'</span><strong>'+b+'</strong></div>',box=(t,b)=>'<section class="card"><h2>'+t+'</h2>'+b+'</section>',field=(k,l,v,step='.01')=>'<label>'+l+'<input data-v7="'+k+'" type="number" min="0" step="'+step+'" value="'+(Number(v)||0)+'"></label>';
const txkey=t=>t.import_id||[t.date,t.account,t.description,t.amount].join('|');
function transactions(s){const m=new Map();for(const t of s.transactions||[]){if(!t||!/^\d{4}-\d{2}-\d{2}/.test(String(t.date||''))||!Number.isFinite(Number(t.amount)))continue;const k=txkey(t);if(!m.has(k))m.set(k,t)}return [...m.values()]}
function classify(t,p){const k=txkey(t),over=p.overrides?.[k];if(over)return over;const d=norm(t.description),e=String(t.category||'');if(/CREDIBOM|CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/.test(d)||e==='Debt payment')return 'Prestação';if(e==='Transfer'||/TRANSFERENCIA ENTRE CONTAS|REVOLUT TOP UP|TRANSFER TO OWN/.test(d))return 'Transferência';if(e==='Salary'||/VENCIMENTO|SALARIO|ORDENADO/.test(d))return 'Salário';if(n(t.amount)>=0)return 'Entrada';for(const [re,c] of rules)if(re.test(d))return c;return categories.includes(e)?e:'Outros'}
function activeBudget(s,p){const old=read(V6);return {Alimentação:n(s.food),Transportes:n(s.transport),Comunicações:n(s.meo),'Serviços bancários':n(s.bankSubs),Outros:n(s.misc),...(old.budgets||{}),...(p.budgets||{})}}
function snapshotBudget(s,p){const key=mmNow(),history={...(read(V6).budgetHistory||{}),...(p.budgetHistory||{})};if(history[key])return {...p,budgetHistory:history};const u={...p,budgetHistory:{...history,[key]:{categories:activeBudget(s,p),createdAt:new Date().toISOString(),source:'automatic-first-visit-v7'}}};write(V7,u);return u}
function priorMonth(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthReview(s,p){
 const mm=priorMonth(),list=transactions(s).filter(t=>month(t.date)===mm),sp=list.filter(t=>n(t.amount)<0&&!['Prestação','Transferência'].includes(classify(t,p))),spent=sp.reduce((a,t)=>a-n(t.amount),0),snap=p.budgetHistory?.[mm],bud=snap?.categories||activeBudget(s,p),budget=Object.values(bud).reduce((a,v)=>a+n(v),0),cats={};
 for(const t of sp){const c=classify(t,p);cats[c]=(cats[c]||0)-n(t.amount)}
 const pay=[['Credibom',n(s.carRegular)||210.74,/CREDIBOM/],['Caixa Classic',n(s.cardRegular)||231.25,/CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/]].map(([name,amount,re])=>({name,amount,ok:!!s.paymentConfirmations?.[mm]?.[name]||list.some(t=>n(t.amount)<0&&re.test(norm(t.description))&&Math.abs(-n(t.amount)-amount)<=1)}));
 const hasBank=list.some(t=>t.import_id),complete=hasBank&&list.length>=5;
 return {mm,list,spent,bud,budget,cats,pay,complete,snap};
}
function recurring(s,p){const m=new Map();for(const t of transactions(s)){if(n(t.amount)>=0||['Prestação','Transferência'].includes(classify(t,p)))continue;const label=norm(t.description).replace(/\d+/g,'').replace(/\s+/g,' ').trim().slice(0,42);if(label.length<4)continue;const a=m.get(label)||[];a.push(t);m.set(label,a)}return [...m].filter(([_,a])=>new Set(a.map(t=>month(t.date))).size>=2).map(([name,a])=>({name,months:new Set(a.map(t=>month(t.date))).size,avg:a.reduce((v,t)=>v-n(t.amount),0)/a.length})).sort((a,b)=>b.avg-a.avg).slice(0,10)}
function loan(balance,annual,payment,extra=0){let b=Math.max(0,n(balance)-n(extra)),rate=n(annual)/1200,pay=n(payment);if(!b)return {valid:true,months:0,interest:0};if(pay<=b*rate)return {valid:false};let interest=0,months=0;while(b>.005&&months<1200){const i=b*rate;interest+=i;b=Math.max(0,b+i-Math.min(b+i,pay));months++}return {valid:months<1200,months,interest}}
function automaticIncome(s){
 const rows=transactions(s).filter(t=>n(t.amount)>0&&/^T(F|R)I?\s+ASSOCIACAO\s+RAEGE$/.test(norm(t.description).replace(/\s+/g,' ').trim()));
 const seed=n(s.salary)||2096.22;
 const regular=rows.filter(t=>{const a=n(t.amount);return seed>0?a>=seed*.7&&a<=seed*1.35:a>=1200&&a<=3500});
 const byMonth={};for(const t of regular){const m=month(t.date);const a=n(t.amount);if(!byMonth[m]||Math.abs(a-seed)<Math.abs(byMonth[m]-seed))byMonth[m]=a}
 const months=Object.keys(byMonth).sort(),vals=months.slice(-6).map(m=>byMonth[m]).sort((a,b)=>a-b);
 const current=byMonth[mmNow()]||0,median=vals.length?(vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2):0;
 return {current,reference:median||seed,months:vals.length,latestMonth:months.at(-1)||'',latest:months.length?byMonth[months.at(-1)]:0};
}
function automaticBankCash(s){
 if(Number.isFinite(Number(s.bankCashTotal)))return {value:Number(s.bankCashTotal),count:Number(s.bankCashCount)||0,asOf:s.bankCashAsOf||s.bankSync?.generated_at||"",source:"stored-total"};
 const banks=s.bankSync?.banks||{},roles=s.accountRoles||{};let total=0,count=0;
 for(const [bank,b] of Object.entries(banks)){for(const a of (b.accounts||[])){const role=roles[String(bank).toLowerCase()+"|"+String(a.account_ref||"")]||"unassigned",bal=a.balance||{};if((role==="current"||role==="savings")&&bal.currency==="EUR"&&bal.amount!==null&&bal.amount!==undefined&&Number.isFinite(Number(bal.amount))){total+=Number(bal.amount);count++}}}
 return {value:count?total:n(s.balance),count,asOf:s.bankSync?.generated_at||s.balanceDate||"",source:count?"computed":"legacy-balance"};
}
function safeAmort(c,s,p){const reserve=n(s.reserve)||5000,cushion=n(p.safetyBuffer??s.workingBuffer),days=n(p.daysUntilSalary),remaining=days>0?Math.min(31,days):null,essential=n(c.expenses)+n(c.carPay)+n(c.cardPay),upcoming=remaining===null?null:essential*remaining/30,available=upcoming===null?null:Math.max(0,c.cash-reserve-cushion-upcoming),safe=available===null?null:Math.min(c.car,available);return {reserve,cushion,remaining,upcoming,safe,ok:safe!==null&&n(c.extra)<=safe}}
function health(s,p,c,review){const current=transactions(s).filter(t=>month(t.date)===mmNow()),expense=current.filter(t=>n(t.amount)<0&&!['Prestação','Transferência'].includes(classify(t,p))).reduce((a,t)=>a-n(t.amount),0),b=Object.values(activeBudget(s,p)).reduce((a,v)=>a+n(v),0),reserve=n(s.reserve),debtPay=n(c.carPay)+n(c.cardPay);const parts=[{name:'Orçamento',w:25,v:b&&current.length?Math.max(0,Math.min(1,1-Math.max(0,expense-b)/b)):null},{name:'Poupança efetiva',w:25,v:null},{name:'Endividamento',w:20,v:n(c.income)&&debtPay?Math.max(0,1-debtPay/n(c.income)/.4):null},{name:'Reserva',w:20,v:reserve?Math.min(1,n(c.cash)/reserve):null},{name:'Pagamentos',w:10,v:review.complete?review.pay.every(x=>x.ok)?1:.5:null}],known=[];for(const x of parts)if(x.v!==null)known.push(x);const w=known.reduce((a,x)=>a+x.w,0);return {parts,coverage:w,score:w?known.reduce((a,x)=>a+x.w*x.v,0)/w*100:null}}
function render(){
 const s=read(KEY),p=snapshotBudget(s,read(V7)),r=monthReview(s,p),rep=recurring(s,p),bankCash=automaticBankCash(s),autoIncome=automaticIncome(s),c={cash:n(bankCash.value),other:n(p.other),car:n(s.debtEstimates?.car?.balance??s.carBalance),card:n(s.debtEstimates?.card?.balance??s.cardBalance),carAPR:n(p.carAPR??s.carAPR),cardAPR:n(p.cardAPR??s.cardAPR),carPay:n(p.carPay??s.carRegular??210.74),cardPay:n(p.cardPay??s.cardRegular??231.25),extra:n(p.extra),income:n(autoIncome.reference),expenses:n(p.expenses??Object.values(activeBudget(s,p)).reduce((a,v)=>a+n(v),0))},net=c.cash+c.other-c.car-c.card,base=loan(c.car,c.carAPR,c.carPay),fast=loan(c.car,c.carAPR,c.carPay,c.extra),prud=safeAmort(c,s,p),hs=health(s,p,c,r),history=p.netWorthHistory||{};
 let html=box('Revisão automática do mês anterior · '+r.mm,'<p class="muted">'+(r.snap?'Usa o orçamento histórico guardado em '+esc(r.snap.createdAt?.slice(0,10)||r.mm)+'.':'Sem orçamento histórico original; os limites atuais são apenas referência.')+'</p>'+row('Movimentos disponíveis',String(r.list.length))+row('Despesas classificadas',eur(r.spent))+row('Orçamento',r.budget?eur(r.budget):'Não definido')+row('Execução',r.budget?(r.spent/r.budget*100).toFixed(1)+'%':'—')+row('Avaliação',!r.complete?'⚪ Dados insuficientes':r.spent<=r.budget?'🟢 Dentro do orçamento':'🔴 Acima do orçamento')+r.pay.map(x=>row(x.name,x.ok?'🟢 Identificado/confirmado':'⚪ Não identificado')).join(''));
 html+=box('Orçamento por categoria',categories.map(cat=>{const spent=n(r.cats[cat]),limit=n(r.bud[cat]),over=limit>0&&spent>limit,w=limit?Math.min(100,spent/limit*100):0;return row(cat,eur(spent)+' / '+eur(limit))+'<div class="bar"><div class="'+(over?'over':'')+'" style="width:'+w+'%"></div></div>'}).join('')+'<p class="muted">O orçamento corrente é configurado no Overview → Budget e fica arquivado automaticamente por mês.</p>');
 html+=box('Património líquido','<div class="grid">'+row('Ativos registados',eur(c.cash+c.other))+row('Passivos registados',eur(c.car+c.card))+row('Património líquido estimado',eur(net))+'</div><p class="muted">A reserva faz parte do dinheiro existente e não é somada novamente.</p>');
 html+=box('Valores de referência',row('Dinheiro total nas contas',eur(c.cash))+row('Origem','🟢 Automático · '+bankCash.count+' conta(s) corrente/poupança identificada(s)')+row('Atualizado em',bankCash.asOf?esc(String(bankCash.asOf).replace('T',' ').slice(0,16)):'Sem data de importação')+'<div class="grid">'+field('other','Outros ativos líquidos (€)',c.other)+field('car','Capital em dívida — Credibom (€)',c.car)+field('card','Dívida — Caixa Classic (€)',c.card)+field('carAPR','Taxa anual Credibom (%)',c.carAPR)+field('cardAPR','Taxa anual cartão (%)',c.cardAPR)+field('carPay','Prestação Credibom (€)',c.carPay)+field('cardPay','Pagamento mensal cartão (€)',c.cardPay)+'</div><button id="save">Guardar valores</button>');
 html+=box('Amortização Credibom',field('extra','Amortização antecipada única (€)',c.extra)+row('Sem amortização extra',base.valid?base.months+' meses · juros '+eur(base.interest):'Prestação insuficiente')+row('Com amortização',fast.valid?fast.months+' meses · juros '+eur(fast.interest):'Prestação insuficiente')+row('Poupança bruta estimada',base.valid&&fast.valid?eur(base.interest-fast.interest):'Indisponível')+'<div class="grid">'+field('daysUntilSalary','Dias até ao próximo salário',p.daysUntilSalary||0,'1')+field('safetyBuffer','Margem adicional de segurança (€)',p.safetyBuffer??s.workingBuffer??0)+'</div>'+row('Despesas estimadas até ao salário',prud.upcoming===null?'⚪ Indicar dias':eur(prud.upcoming))+row('Máximo prudente estimado',prud.safe===null?'⚪ Dados insuficientes':eur(prud.safe))+row('Situação da amortização simulada',prud.safe===null?'⚪ Não avaliada':prud.ok?'🟢 Dentro do limite':'🔴 Acima do limite')+'<button id="simulate">Atualizar simulação</button><p class="muted">Estimativa conservadora; não inclui comissões, seguros, impostos ou alterações contratuais.</p>');
 const hasForecast=c.income>0&&c.expenses>0;html+=box('Previsão de tesouraria · 12 meses',row('Rendimento detetado este mês',autoIncome.current?eur(autoIncome.current):'⚪ Ainda não detetado')+row('Rendimento mensal de referência',autoIncome.reference?eur(autoIncome.reference):'⚪ Dados insuficientes')+row('Base do cálculo',autoIncome.months?'Mediana de '+autoIncome.months+' mês(es) com salário identificado':'Último/valor legado disponível')+'<div class="grid">'+field('expenses','Despesas previstas sem prestações (€)',c.expenses)+'</div><button id="forecast">Atualizar previsão</button>'+(hasForecast?'<div class="scroll"><table><thead><tr><th>Mês</th><th>Conservador</th><th>Base</th><th>Otimista</th></tr></thead><tbody>'+Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i+1);const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return '<tr><td>'+m+'</td>'+[1.15,1,.9].map(f=>'<td>'+eur(c.cash+(i+1)*(c.income-c.expenses*f-c.carPay-c.cardPay))+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>':'<p class="muted">Define rendimento e despesas.</p>')+'<p class="muted">Projeção simplificada; não inclui 13.º/14.º mês, juros, imprevistos ou fim antecipado de prestações.</p>');
 html+=box('Saúde financeira · experimental',row('Pontuação parcial',hs.score===null?'Dados insuficientes':hs.score.toFixed(0)+'/100')+row('Cobertura',hs.coverage+'%')+hs.parts.map(x=>row(x.name+' ('+x.w+'%)',x.v===null?'⚪ Não avaliado':(x.v*100).toFixed(0)+'%')).join('')+'<p class="muted">Índice interno exploratório. Não é classificação de crédito nem aconselhamento regulado.</p>');
 html+=box('Despesas recorrentes detetadas',rep.length?rep.map(x=>row(esc(x.name),eur(x.avg)+' média · '+x.months+' meses')).join(''):'<p class="muted">São necessários movimentos em pelo menos dois meses.</p>');
 html+=box('Histórico mensal do património',row('Registos',String(Object.keys(history).length))+'<button id="snapshot">Guardar fotografia financeira deste mês</button>'+(Object.keys(history).length?'<div class="scroll"><table><thead><tr><th>Mês</th><th>Ativos</th><th>Dívidas</th><th>Património</th></tr></thead><tbody>'+Object.entries(history).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,v])=>'<tr><td>'+esc(m)+'</td><td>'+eur(v.assets)+'</td><td>'+eur(v.debts)+'</td><td>'+eur(v.net)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Ainda sem registos.</p>'));
 html+=box('Backup encriptado','<p>Exporta o estado da aplicação e configurações da v7 num ficheiro protegido por palavra-passe.</p><button id="backup">Criar backup encriptado</button> <label style="display:inline-block">Restaurar backup<input id="restore" type="file" accept=".mfcbackup,application/json"></label><p class="muted">O restauro substitui os dados locais após confirmação.</p>');

}
function gather(){const p=read(V7);document.querySelectorAll('[data-v7]').forEach(e=>p[e.dataset.v7]=n(e.value));delete p.cash;delete p.car;delete p.card;delete p.income;write(V7,p);return p}
function bind(){for(const id of ['save','simulate','forecast'])document.getElementById(id).onclick=()=>{gather();render();notice('Valores atualizados.')};document.getElementById('snapshot').onclick=()=>{const p=gather(),s=read(KEY),bankCash=automaticBankCash(s),c={cash:n(bankCash.value),other:n(p.other),car:n(s.debtEstimates?.car?.balance??s.carBalance),card:n(s.debtEstimates?.card?.balance??s.cardBalance)},assets=c.cash+c.other,debts=c.car+c.card,key=mmNow();if(!confirm('Guardar '+key+' como fotografia financeira?'))return;write(V7,{...p,netWorthHistory:{...(p.netWorthHistory||{}),[key]:{assets,debts,net:assets-debts,recordedAt:new Date().toISOString()}}});render();notice('Fotografia financeira guardada.')};document.getElementById('backup').onclick=backup;document.getElementById('restore').onchange=restore}
function notice(t){document.getElementById('notice').textContent=t}
const enc=new TextEncoder(),dec=new TextDecoder(),b64=b=>btoa(String.fromCharCode(...b)),unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function derive(password,salt){const m=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function backup(){try{const password=prompt('Palavra-passe forte para o backup (mínimo 12 caracteres):');if(password===null)return;if(password.length<12)return notice('Usa pelo menos 12 caracteres.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(password,salt),payload=enc.encode(JSON.stringify({state:read(KEY),settings:read(V7),exported_at:new Date().toISOString()})),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'mfc-v7-backup',salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))})],{type:'application/json'}));a.download='my-finance-v7-'+today()+'.mfcbackup';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notice('Backup encriptado criado.')}catch(e){notice('Erro no backup: '+e.message)}}
async function restore(ev){const f=ev.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!['mfc-v7-backup','mfc-v6-backup'].includes(data.format))throw Error('Formato não suportado');const password=prompt('Palavra-passe do backup:');if(password===null)return;const key=await derive(password,unb64(data.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(data.iv)},key,unb64(data.ciphertext)),parsed=JSON.parse(dec.decode(plain));if(!parsed.state||!parsed.settings)throw Error('Backup inválido');if(!confirm('Substituir os dados locais atuais pelo backup?'))return;write(KEY,parsed.state);write(V7,parsed.settings);render();notice('Backup restaurado.')}catch(e){notice('Falha ao restaurar: '+e.message)}finally{ev.target.value=''}}
render();window.addEventListener('pageshow',render);window.addEventListener('focus',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});window.addEventListener('storage',e=>{if([KEY,V7].includes(e.key))render()});
</script></body></html>
