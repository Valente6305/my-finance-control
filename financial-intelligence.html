function recurring(s,p){const m=new Map();for(const t of transactions(s)){if(n(t.amount)>=0||['Prestação','Transferência'].includes(classify(t,p)))continue;const label=norm(t.description).replace(/\d+/g,'').replace(/\s+/g,' ').trim().slice(0,42);if(label.length<4)continue;const a=m.get(label)||[];a.push(t);m.set(label,a)}return [...m].filter(([_,a])=>new Set(a.map(t=>month(t.date))).size>=2).map(([name,a])=>({name,months:new Set(a.map(t=>month(t.date))).size,avg:a.reduce((v,t)=>v-n(t.amount),0)/a.length})).sort((a,b)=>b.avg-a.avg).slice(0,10)}

function automaticBankCash(s){

 const bankIncomeRef=autoIncome.reference,preDeductionIncomeRef=bankIncomeRef+currentPayroll.total,hasForecast=bankIncomeRef>0&&c.expenses>0;html+=box('Previsão de tesouraria · 12 meses',row('Crédito líquido no banco',autoIncome.current?eur(autoIncome.current):'⚪ Ainda não detetado')+row('Rendimento mensal antes das deduções NAV',preDeductionIncomeRef?eur(preDeductionIncomeRef):'⚪ Dados insuficientes')+row('Base do cálculo',autoIncome.months?'Mediana de '+autoIncome.months+' mês(es) com salário identificado':'Último/valor legado disponível')+'<div class="grid">'+field('expenses','Despesas previstas sem prestações (€)',c.expenses)+'</div><button id="forecast">Atualizar previsão</button>'+(hasForecast?'<div class="scroll"><table><thead><tr><th>Mês</th><th>Conservador</th><th>Base</th><th>Otimista</th></tr></thead><tbody>'+Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i+1);const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return '<tr><td>'+m+'</td>'+[1.15,1,.9].map(f=>'<td>'+eur(c.cash+(i+1)*(bankIncomeRef-c.expenses*f-c.carPay-c.cardPay))+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>':'<p class="muted">Define rendimento e despesas.</p>')+'<p class="muted">Projeção simplificada; não inclui 13.º/14.º mês, juros, imprevistos ou fim antecipado de prestações.</p>');

function gather(){const p=read(V7);document.querySelectorAll('[data-v7]').forEach(e=>p[e.dataset.v7]=n(e.value));delete p.cash;delete p.car;delete p.card;delete p.income;delete p.safetyBuffer;delete p.daysUntilSalary;write(V7,p);return p}
function bind(){for(const id of ['save','simulate','forecast'])document.getElementById(id).onclick=()=>{gather();render();notice('Valores atualizados.')};document.getElementById('snapshot').onclick=()=>{const p=gather(),s=read(KEY),bankCash=automaticBankCash(s),c={cash:n(bankCash.value),other:n(p.other),car:n(s.debtEstimates?.car?.balance??s.carBalance),card:n(s.debtEstimates?.card?.balance??s.cardBalance)},assets=c.cash+c.other,debts=c.car+c.card,key=mmNow();if(!confirm('Guardar '+key+' como fotografia financeira?'))return;write(V7,{...p,netWorthHistory:{...(p.netWorthHistory||{}),[key]:{assets,debts,net:assets-debts,recordedAt:new Date().toISOString()}}});render();notice('Fotografia financeira guardada.')};document.getElementById('backup').onclick=backup;document.getElementById('restore').onchange=restore}
function notice(t){document.getElementById('notice').textContent=t}
const enc=new TextEncoder(),dec=new TextDecoder(),b64=b=>btoa(String.fromCharCode(...b)),unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function derive(password,salt){const m=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function backup(){try{const password=prompt('Palavra-passe forte para o backup (mínimo 12 caracteres):');if(password===null)return;if(password.length<12)return notice('Usa pelo menos 12 caracteres.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(password,salt),payload=enc.encode(JSON.stringify({state:read(KEY),settings:read(V7),exported_at:new Date().toISOString()})),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'mfc-v7-backup',salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))})],{type:'application/json'}));a.download='my-finance-v7-'+today()+'.mfcbackup';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notice('Backup encriptado criado.')}catch(e){notice('Erro no backup: '+e.message)}}
async function restore(ev){const f=ev.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!['mfc-v7-backup','mfc-v6-backup'].includes(data.format))throw Error('Formato não suportado');const password=prompt('Palavra-passe do backup:');if(password===null)return;const key=await derive(password,unb64(data.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(data.iv)},key,unb64(data.ciphertext)),parsed=JSON.parse(dec.decode(plain));if(!parsed.state||!parsed.settings)throw Error('Backup inválido');if(!confirm('Substituir os dados locais atuais pelo backup?'))return;write(KEY,parsed.state);write(V7,parsed.settings);render();notice('Backup restaurado.')}catch(e){notice('Falha ao restaurar: '+e.message)}finally{ev.target.value=''}}
render();window.addEventListener('pageshow',render);window.addEventListener('focus',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});window.addEventListener('storage',e=>{if([KEY,V7].includes(e.key))render()});
</script></body></html>
