<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Intelligence · My Finance Control</title><style>
:root{font:15px system-ui,sans-serif;color:#172b3c;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:white;padding:22px max(16px,calc((100vw - 1100px)/2))}h1{margin:0;font-size:1.5rem}main{max-width:1100px;margin:auto;padding:18px 14px 50px}a{color:#11618a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:white;border:1px solid #dde5eb;border-radius:13px;padding:17px;margin-bottom:14px}h2{margin:0 0 12px;font-size:1.15rem}h3{font-size:1rem}.muted{color:#647789;font-size:.88rem}.flag{border-left:6px solid #b42332;background:#fff4f4}.flag.ok{border-left-color:#18845e;background:#edf9f2}.flag.warn{border-left-color:#bd7a16;background:#fff8e9}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf0f2;flex-wrap:wrap}.row:last-child{border:0}button,.button{border:0;border-radius:8px;background:#10243a;color:white;padding:10px 13px;cursor:pointer;text-decoration:none;display:inline-block;font:inherit}input,select{padding:9px;border:1px solid #aab9c7;border-radius:7px;max-width:100%;font:inherit}label{display:block;margin:8px 0}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar{height:12px;background:#e5edf2;border-radius:12px;overflow:hidden}.bar>div{height:100%;background:#16855e}.bar>div.over{background:#b42332}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #e7ebef}small{color:#65798b}.scroll{overflow:auto}#message{font-weight:650}
</style></head><body><header><h1>◈ Financial Intelligence · v6</h1><p>Controlo financeiro local · previsão, alertas, classificação e relatórios</p></header><main><p><a href="./index.html">← Painel principal</a> · <a href="./bank-accounts.html">Importar ficheiro .mfc</a></p><div id="message" role="status"></div><div id="app"></div></main><script>
'use strict';
const KEY='finance-control-public-v2',SET='finance-intelligence-v6-settings';
const eur=x=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(x)||0);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>Number(x)||0,month=d=>String(d||'').slice(0,7),today=()=>new Date().toISOString().slice(0,10);
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}};
const prefs=()=>{try{return JSON.parse(localStorage.getItem(SET)||'{}')}catch{return {}}};
const persist=p=>localStorage.setItem(SET,JSON.stringify(p));
const note=x=>document.getElementById('message').textContent=x;
const categories=['Alimentação','Transportes','Comunicações','Serviços bancários','Habitação e serviços','Saúde','Família','Lazer','Outros'];
const rules=[[/CONTINENTE|PINGO DOCE|LIDL|ALDI|INTERMARCHE|AUCHAN|SUPERMERCADO|MERCADO /,'Alimentação'],[/COMBUST|GALP|REPSOL|BP |CEPSA|POSTO /,'Transportes'],[/MEO|NOS COMUNIC|VODAFONE|TELECOM/,'Comunicações'],[/COMISSAO|MANUTENCAO CONTA|ANUIDADE/,'Serviços bancários'],[/RENDA|ELECTRIC|ELETRIC|EDP|AGUA|ENERGIA/,'Habitação e serviços'],[/FARMAC|CLINIC|HOSPITAL/,'Saúde']];
const normalize=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function classify(t,p){const key=t.import_id||t.date+'|'+t.description+'|'+t.amount;if(p.overrides?.[key])return p.overrides[key];const desc=normalize(t.description),existing=String(t.category||'');if(/CREDIBOM|CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/.test(desc)||existing==='Debt payment')return 'Prestação';if(existing==='Transfer'||/TRANSFERENCIA ENTRE CONTAS|REVOLUT TOP UP/.test(desc))return 'Transferência';if(existing==='Salary'||/VENCIMENTO|SALARIO|ORDENADO/.test(desc))return 'Salário';if(n(t.amount)>=0)return 'Entrada';for(const [re,cat] of rules)if(re.test(desc))return cat;return categories.includes(existing)?existing:'Outros'}
const txkey=t=>t.import_id||t.date+'|'+t.description+'|'+t.amount;
const transactions=s=>(s.transactions||[]).filter(t=>t&&/^\d{4}-\d{2}-\d{2}/.test(String(t.date||''))&&Number.isFinite(Number(t.amount)));
function monthsBetween(a,b){return (Number(b.slice(0,4))-Number(a.slice(0,4)))*12+Number(b.slice(5,7))-Number(a.slice(5,7))}
function makeReport(s,p){
 const all=transactions(s),current=today().slice(0,7),historical=all.filter(t=>month(t.date)===current),debts={},counts={};
 const unique=new Map();for(const t of all){const key=txkey(t);if(unique.has(key))counts[key]=(counts[key]||1)+1;else unique.set(key,t)}
 const list=[...unique.values()],monthTx=list.filter(t=>month(t.date)===current);
 const spending=monthTx.filter(t=>n(t.amount)<0&&!['Prestação','Transferência'].includes(classify(t,p)));
 const totals={};for(const t of spending){const cat=classify(t,p);totals[cat]=(totals[cat]||0)-n(t.amount)}
 const budget={Alimentação:n(s.food),Transportes:n(s.transport),Comunicações:n(s.meo),'Serviços bancários':n(s.bankSubs),Outros:n(s.misc),...(p.budgets||{})};
 const spendingTotal=Object.values(totals).reduce((a,b)=>a+b,0);
 const budgetTotal=Object.values(budget).reduce((a,b)=>a+n(b),0);
 const currentBalance=n(s.balance),reserve=n(s.reserve),buffer=n(s.workingBuffer);
 const payDefs=[['Credibom',n(s.carRegular),/CREDIBOM/],['Caixa Classic',n(s.cardRegular),/CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/]];
 const payments=payDefs.map(([name,amount,re])=>{const matches=monthTx.filter(t=>n(t.amount)<0&&re.test(normalize(t.description)));return {name,amount,paid:matches.reduce((a,t)=>a-n(t.amount),0),count:matches.length}});
 const pending=payments.reduce((a,x)=>a+(x.count?0:x.amount),0);
 const remainingBudget=Math.max(0,budgetTotal-spendingTotal);
 const projected=currentBalance-reserve-buffer-pending-remainingBudget;
 const generated=String(s.bankSync?.generated_at||''),age=generated?Math.floor((Date.now()-new Date(generated).getTime())/86400000):null;
 const recent=monthTx.length>0,dups=Object.keys(counts).length;
 const alert=[];
 if(!generated||!Number.isFinite(age))alert.push(['warn','Ainda não existe uma sincronização bancária confirmada.']);
 else if(age>2)alert.push(['warn','Última importação bancária há '+age+' dias.']);
 if(dups)alert.push(['warn',dups+' identificadores de movimentos repetidos no histórico.']);
 for(const pay of payments)if(!pay.count)alert.push(['warn','Prestação '+pay.name+' não identificada nos movimentos importados deste mês; verificar prazo e extrato.']);
 for(const cat of categories)if(n(budget[cat])>0&&n(totals[cat])>n(budget[cat]))alert.push(['bad',cat+' excedeu o orçamento em '+eur(n(totals[cat])-n(budget[cat]))+'.']);
 if(projected<0)alert.push(['bad','Previsão de saldo protegido insuficiente: '+eur(projected)+'.']);
 const monthly={};for(const t of list){if(n(t.amount)>=0||['Prestação','Transferência'].includes(classify(t,p)))continue;const m=month(t.date);monthly[m]=(monthly[m]||0)-n(t.amount)}
 const recurring=new Map();for(const t of list){if(n(t.amount)>=0||['Prestação','Transferência'].includes(classify(t,p)))continue;const label=normalize(t.description).replace(/\d+/g,'').replace(/\s+/g,' ').trim().slice(0,42);if(label.length<4)continue;const a=recurring.get(label)||[];a.push(t);recurring.set(label,a)}
 const repeat=[...recurring].filter(([_,a])=>new Set(a.map(t=>month(t.date))).size>=2).map(([name,a])=>({name,occurrences:a.length,average:a.reduce((v,t)=>v-n(t.amount),0)/a.length,latest:a.map(t=>t.date).sort().at(-1)})).sort((a,b)=>b.average-a.average).slice(0,10);
 return {all,list,monthTx,totals,budget,spendingTotal,budgetTotal,currentBalance,reserve,buffer,payments,pending,remainingBudget,projected,age,alert,monthly,repeat,dups,recent,current};
}
const card=(title,html,cls='')=>'<section class="card '+cls+'"><h2>'+title+'</h2>'+html+'</section>';
const row=(a,b)=>'<div class="row"><span>'+a+'</span><strong>'+b+'</strong></div>';
const download=(name,data,type)=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
function render(){
 const s=read(),p=prefs(),r=makeReport(s,p);
 let html=card('Estado financeiro', '<div class="grid">'+[
 ['Saldo CGD',eur(r.currentBalance)],['Reserva protegida',eur(r.reserve)],['Prestações por identificar',eur(r.pending)],['Orçamento ainda disponível',eur(r.remainingBudget)],['Previsão conservadora',eur(r.projected)]
 ].map(([a,b])=>'<div>'+row(esc(a),esc(b))+'</div>').join('')+'</div><p class="muted">Previsão até ao próximo salário: saldo atual menos reserva, margem de segurança, prestações não identificadas e orçamento mensal por utilizar. Não inclui movimentos futuros desconhecidos.</p>',r.projected<0?'flag':'flag ok');
 html+=card('Semáforos e alertas',r.payments.map(x=>'<div class="card flag '+(x.count?'ok':r.recent?'':'warn')+'">'+row(esc(x.name),x.count?'🟢 Detetada · '+eur(x.paid):r.recent?'🔴 Não identificada':'🟠 Sem dados do mês')+'</div>').join('')+'<div class="card flag '+(r.spendingTotal>r.budgetTotal?'':'ok')+'">'+row('Despesas mensais',eur(r.spendingTotal)+' / '+eur(r.budgetTotal))+'</div>'+r.alert.map(([kind,msg])=>'<p class="card flag '+(kind==='warn'?'warn':'')+'">'+esc(msg)+'</p>').join('')+'<p class="muted">Ausência de movimento não prova atraso. Os limites dependem da qualidade e cobertura dos extratos.</p>');
 html+=card('Orçamento por categoria',categories.map(cat=>{const spent=n(r.totals[cat]),limit=n(r.budget[cat]),over=limit>0&&spent>limit,pct=limit?Math.min(100,spent/limit*100):0;return '<div>'+row(esc(cat),'<span style="color:'+(over?'#b42332':'#14765b')+'">'+eur(spent)+' / '+eur(limit)+'</span>')+'<div class="bar"><div class="'+(over?'over':'')+'" style="width:'+pct+'%"></div></div></div>'}).join('')+'<p class="muted">Orçamentos sem limite definido não geram alerta. Valores editáveis abaixo.</p>');
 html+=card('Configuração dos limites e margem',categories.map(cat=>'<label>'+esc(cat)+' (€) <input type="number" step="0.01" min="0" data-budget="'+esc(cat)+'" value="'+(n(r.budget[cat]))+'"></label>').join('')+'<button id="saveBudgets">Guardar orçamentos</button>');
 const history=Object.entries(r.monthly).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
 html+=card('Histórico mensal',history.length?'<div class="scroll"><table><thead><tr><th>Mês</th><th>Despesas</th></tr></thead><tbody>'+history.map(([m,v])=>'<tr><td>'+esc(m)+'</td><td>'+eur(v)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Sem histórico suficiente.</p>');
 html+=card('Despesas recorrentes detetadas',r.repeat.length?r.repeat.map(x=>row(esc(x.name),eur(x.average)+' em média · '+x.occurrences+' movimentos')).join(''):'<p class="muted">São necessários movimentos em pelo menos dois meses.</p>');
 const loans=[['Credibom',s.debtEstimates?.car?.balance??s.carBalance],['Caixa Classic',s.debtEstimates?.card?.balance??s.cardBalance]];
 html+=card('Objetivos e dívidas',row('Reserva de emergência',eur(r.reserve))+row('Trotinete · objetivo',eur(s.scooterTarget))+row('Trotinete · reservado',eur(s.scooter))+loans.map(([name,v])=>row(name+' · estimativa',eur(v))).join('')+'<p class="muted">Dívidas estimadas dependem dos saldos de referência e da identificação dos pagamentos; compras novas no cartão não estão incluídas.</p>');
 html+=card('Simulador de decisão','<label>Amortização adicional (€) <input id="extra" type="number" min="0" step="0.01" value="'+n(p.extra)+'"></label><button id="simulate">Simular</button><div id="simulation">'+(p.extra?row('Disponível após amortização',eur(r.projected-n(p.extra))):'')+'</div><p class="muted">Simulação de liquidez, não calcula juros poupados nem confirma valores de liquidação junto do credor.</p>');
 html+=card('Revisão de classificações','<p class="muted">As regras automáticas são sugestões. Corrige abaixo os movimentos; as correções ficam guardadas localmente e não alteram o extrato original.</p><div class="scroll"><table><thead><tr><th>Data</th><th>Movimento</th><th>Valor</th><th>Categoria</th></tr></thead><tbody>'+r.monthTx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40).map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.description)+'</td><td>'+eur(t.amount)+'</td><td><select data-override="'+esc(txkey(t))+'">'+['Prestação','Transferência','Salário','Entrada',...categories].map(cat=>'<option value="'+esc(cat)+'" '+(classify(t,p)===cat?'selected':'')+'>'+esc(cat)+'</option>').join('')+'</select></td></tr>').join('')+'</tbody></table></div>');
 html+=card('Exportação, cópia de segurança e auditoria','<div class="flex"><button id="csv">Exportar relatório CSV</button><button id="htmlReport">Relatório para imprimir / PDF</button><button id="backup">Backup encriptado</button><label>Restaurar backup <input id="restore" type="file" accept=".mfcbackup,.json"></label></div><p class="muted">O backup contém dados financeiros pessoais e é protegido por palavra-passe definida por ti. Não partilhes a palavra-passe. A reposição substitui o estado financeiro local após confirmação.</p>'+row('Movimentos importados e únicos',r.list.filter(t=>t.import_id).length+' / '+r.list.length)+row('Duplicados identificados',r.dups)+row('Última importação',esc(s.bankSync?.generated_at||'Não disponível'))+'<p class="muted">Os dados permanecem neste navegador. Sem transferências automáticas nem acesso direto às contas.</p>');
 document.getElementById('app').innerHTML=html;
 document.getElementById('saveBudgets').onclick=()=>{const p=prefs();p.budgets={};document.querySelectorAll('[data-budget]').forEach(el=>p.budgets[el.dataset.budget]=Math.max(0,n(el.value)));persist(p);render();note('Limites guardados.')};
 document.querySelectorAll('[data-override]').forEach(el=>el.onchange=()=>{const p=prefs();p.overrides=p.overrides||{};p.overrides[el.dataset.override]=el.value;persist(p);render();note('Classificação corrigida.')});
 document.getElementById('simulate').onclick=()=>{const p=prefs();p.extra=Math.max(0,n(document.getElementById('extra').value));persist(p);document.getElementById('simulation').innerHTML=row('Disponível após amortização',eur(r.projected-p.extra))};
 document.getElementById('csv').onclick=()=>{const rows=[['Mês','Categoria','Gasto','Orçamento'],...categories.map(cat=>[r.current,cat,n(r.totals[cat]),n(r.budget[cat])])];download('finance-report-'+r.current+'.csv','\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};
 document.getElementById('htmlReport').onclick=()=>window.print();
 document.getElementById('backup').onclick=backup;
 document.getElementById('restore').onchange=restore;
}
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=bytes=>btoa(String.fromCharCode(...bytes)),unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function derive(password,salt){const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function backup(){try{const password=prompt('Define uma palavra-passe forte para o backup (mínimo 12 caracteres):');if(password===null)return;if(password.length<12){note('Usa pelo menos 12 caracteres.');return}const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(password,salt),payload=enc.encode(JSON.stringify({state:read(),settings:prefs(),exported_at:new Date().toISOString()})),encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload);download('my-finance-backup-'+today()+'.mfcbackup',JSON.stringify({format:'mfc-v6-backup',salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(encrypted))}),'application/json');note('Backup encriptado exportado.')}catch(e){note('Não foi possível exportar: '+e.message)}}
async function restore(ev){const file=ev.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='mfc-v6-backup')throw Error('Formato de backup não suportado');const password=prompt('Palavra-passe do backup:');if(password===null)return;const key=await derive(password,unb64(data.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(data.iv)},key,unb64(data.ciphertext)),parsed=JSON.parse(dec.decode(plain));if(!parsed.state||!Array.isArray(parsed.state.transactions)||!parsed.settings||typeof parsed.settings!=='object')throw Error('Backup inválido');if(!confirm('Substituir os dados locais atuais pelo backup? Esta operação não pode ser anulada.'))return;localStorage.setItem(KEY,JSON.stringify(parsed.state));persist(parsed.settings);render();note('Backup restaurado.')}catch(e){note('Falha ao restaurar (ficheiro ou palavra-passe inválidos): '+e.message)}finally{ev.target.value=''}}
render();
</script></body></html>
