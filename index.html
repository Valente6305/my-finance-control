<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>My Finance Control</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172b3c;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:white;padding:24px max(18px,calc((100vw - 1080px)/2));}header h1{margin:0;font-size:1.45rem}header p{margin:6px 0 0;color:#c5d3e0;font-size:.88rem}main{max-width:1080px;margin:auto;padding:20px 14px 60px}.tabs{display:flex;overflow:auto;gap:8px;margin-bottom:18px}.tabs button{white-space:nowrap}.tabs button.active{background:#10243a;color:white}button,.button{border:0;border-radius:10px;background:#e3eaf0;color:#18314a;padding:11px 15px;font:inherit;font-weight:600;cursor:pointer}button.primary{background:#16745d;color:white}button.danger{background:#fce8e8;color:#a42323}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:white;border:1px solid #e1e7ed;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #14283a09}.metric small{display:block;color:#647789}.metric strong{display:block;font-size:1.65rem;margin:6px 0}.muted{color:#637589;font-size:.88rem}.good{color:#14765b}.warn{color:#a76512}.bad{color:#b32e36}h2{font-size:1.1rem;margin:0 0 14px}h3{font-size:1rem}label{font-size:.85rem;color:#425568;display:block;margin-bottom:5px}input,select{width:100%;font:inherit;border:1px solid #bdcad6;border-radius:9px;padding:10px;background:white}input[type=checkbox]{width:auto}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.field{margin-bottom:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar{height:12px;background:#e8edf1;border-radius:12px;overflow:hidden;margin:10px 0}.bar>div{height:100%;background:#187d62}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{padding:10px 7px;text-align:left;border-bottom:1px solid #edf0f3}td:last-child,th:last-child{text-align:right}.note{background:#fff6e6;border-left:4px solid #e2a449;padding:12px;border-radius:6px;font-size:.88rem}.hide{display:none}.right{text-align:right}.pill{font-size:.75rem;background:#edf2f6;padding:5px 8px;border-radius:30px}footer{text-align:center;color:#748294;font-size:.78rem;padding:10px}input[type=file]{padding:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row>span{min-width:0}.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f4}.check input{flex-shrink:0}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#173d37;color:white;border-radius:10px;padding:12px 20px;display:none;z-index:10}
.status-card{border-left:6px solid #b42332;background:#fff5f5}.status-card.ok{border-left-color:#14805b;background:#edf9f2}.status-card.pending{border-left-color:#b46c12;background:#fff8e9}.status-badge{font-weight:750;padding:4px 9px;border-radius:8px;background:#f9d9dd;color:#9e1d2a}.status-card.ok .status-badge{background:#d3f2e2;color:#116545}.status-card.pending .status-badge{background:#f9e8c9;color:#8a560c}</style></head><body><header><h1>◈ My Finance Control</h1><p>Personal financial dashboard · EUR · Local-first</p></header><main><nav class="tabs" id="tabs"><button class="active" data-tab="dashboard">Overview</button><button data-tab="budget">Budget</button><button data-tab="debts">Debts</button><button data-tab="goals">Goals</button><button data-tab="transactions">Transactions</button><button data-tab="reminders">Reminders</button><button data-tab="settings">Settings</button><a class="button" href="./bank-accounts.html" style="white-space:nowrap;text-decoration:none">Bank Accounts ↗</a><a class="button" href="./financial-intelligence.html" style="white-space:nowrap;text-decoration:none">Financial Intelligence v6 ↗</a></nav><section id="dashboard"></section><section id="budget" class="hide"></section><section id="debts" class="hide"></section><section id="goals" class="hide"></section><section id="transactions" class="hide"></section><section id="reminders" class="hide"></section><section id="settings" class="hide"></section><footer>Private local data · No bank access · Estimates are not bank confirmations</footer></main><div id="toast"></div><script>
const KEY='finance-control-public-v2';const defaults={salary:0,balance:0,balanceDate:'',reserve:0,cardBalance:0,cardAPR:0,cardRegular:0,cardPaid:false,carBalance:0,carAPR:0,carRegular:0,carPaid:false,meo:0,bankSubs:0,food:0,transport:0,misc:0,cardExtra:0,scooter:0,scooterTarget:0,scooterPlan:0,workingBuffer:0,salaryArrived:false,reminders:{},transactions:[],notes:''};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}};if(!Number(state.carRegular)||Math.abs(Number(state.carRegular)-210)<0.01)state.carRegular=210.74;if(!Number(state.cardRegular))state.cardRegular=231.25;
const money=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(v)=>Number(v)||0;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));toast('Saved on this device')}catch{alert('Local storage unavailable. Export a backup to keep your data.')}};const toast=t=>{let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)};const field=(k,label,step='.01')=>`<div class="field"><label for="${k}">${label}</label><input id="${k}" type="number" step="${step}" value="${num(state[k])}" data-field="${k}"></div>`;const metric=(label,value,sub='',klass='')=>`<div class="card metric"><small>${label}</small><strong class="${klass}">${value}</strong><span class="muted">${sub}</span></div>`;const monthly=()=>state.carRegular+state.cardRegular+state.meo+state.bankSubs+state.food+state.transport+state.misc;const surplus=()=>state.salary-monthly();const unpaid=()=>paymentTraffic().statuses.reduce((sum,p)=>sum+(p.detected?0:p.expected),0);const cashAbove=()=>state.balance-state.reserve-unpaid();const safe=()=>Math.max(0,cashAbove()-state.workingBuffer);const importedMonth=()=>{const mm=new Date().toISOString().slice(0,7);let purchases=0,salary=0,debt=0,unreviewed=0,transfers=0;for(const t of state.transactions||[]){if(!t.import_id||!String(t.date||'').startsWith(mm))continue;const v=num(t.amount),cat=t.category||'Uncategorised';if(['Uncategorised','Card purchase / review'].includes(cat))unreviewed++;if(cat==='Salary'&&v>0)salary+=v;else if(cat==='Debt payment')debt+=Math.abs(v);else if(cat==='Transfer')transfers+=Math.abs(v);else if(v<0&&cat!=='Savings')purchases+=-v}return {mm,purchases,salary,debt,transfers,unreviewed}};const pct=(a,b)=>Math.max(0,Math.min(100,b>0?a/b*100:0));const box=(title,body)=>`<div class="card"><h2>${title}</h2>${body}</div>`;
const PAYMENT_SCHEDULE=[{label:'Credibom',amount:210.74,from:25,to:25,re:/CREDIBOM/},{label:'Caixa Classic',amount:231.25,from:10,to:15,re:/CAIXA CLASSIC|PAGAMENTO CARTAO|CARTAO CREDITO|PAG CARTAO/}];
function paymentTraffic(){
 const now=new Date(),mm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),tx=(state.transactions||[]).filter(t=>t.import_id&&String(t.date||'').startsWith(mm)&&Number(t.amount)<0);
 const normalized=t=>String(t.description||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
 const statuses=PAYMENT_SCHEDULE.map(d=>{const manual=state.paymentConfirmations?.[mm]?.[d.label];const matches=tx.filter(t=>d.re.test(normalized(t))&&Math.abs(-Number(t.amount)-d.amount)<=1);const paid=matches.reduce((sum,t)=>sum-Number(t.amount),0);return {label:d.label,expected:d.amount,paid,manual:!matches.length&&!!manual,detected:matches.length>0||!!manual,stage:matches.length||manual?'ok':!tx.length||now.getDate()<=d.to?'pending':'review',window:d.from===d.to?'dia '+d.to:'dias '+d.from+'–'+d.to}});
 return {mm,statuses};
}
function trafficCard(title,ok,detail,pending=false){const cls=pending?'pending':ok?'ok':'';return '<div class="card status-card '+cls+'"><div class="row"><strong>'+esc(title)+'</strong><span class="status-badge">'+(pending?'A verificar':ok?'✓ Identificado':'✕ Verificar')+'</span></div><p>'+detail+'</p></div>';}
function financeTraffic(){
 const {mm,statuses}=paymentTraffic(),hasImport=!!state.bankSync;
 let cards=statuses.map(x=>trafficCard(x.label+' · '+mm,x.detected,'Pagamento: <b>'+money(x.detected?(x.manual?x.expected:x.paid):0)+'</b>. Prestação habitual: '+money(x.expected)+' ('+x.window+'). '+(x.manual?'Confirmado manualmente, ainda não conciliado com extrato.':x.detected?'Identificado nos movimentos importados.':'Ainda não identificado; confirmar no extrato.')+'<div class="actions"><button data-payment="'+esc(x.label)+'">'+(x.manual?'Anular confirmação manual':x.detected?'Movimento identificado':'Confirmar pagamento')+'</button></div>',x.stage==='pending')).join('');
 const actual=importedMonth().purchases,budget=Number(state.food||0)+Number(state.transport||0)+Number(state.misc||0)+Number(state.meo||0)+Number(state.bankSubs||0);
 cards+=trafficCard('Despesas mensais · '+mm,actual<=budget,'Despesas registadas: <b>'+money(actual)+'</b> / orçamento estimado: <b>'+money(budget)+'</b>.',!hasImport||budget<=0);
 return box('Semáforos financeiros',cards+'<p class="muted">Verde: pagamento identificado. Amarelo: dados insuficientes ou dentro do prazo. Vermelho: prazo habitual ultrapassado sem pagamento correspondente — verificar, não significa atraso confirmado. A identificação exige descrição e valor compatíveis (tolerância de €1).</p>');
}
function render(){let s=state;const status=paymentTraffic().statuses;s.cardPaid=status.some(p=>p.label==='Caixa Classic'&&p.detected);s.carPaid=status.some(p=>p.label==='Credibom'&&p.detected);document.getElementById('dashboard').innerHTML=`<div class="card"><h2>Financial Intelligence v6</h2><p>Previsão de tesouraria, orçamento por categoria, alertas, histórico, simulações e backup encriptado.</p><a class="button" href="./financial-intelligence.html">Abrir análise financeira →</a></div>${financeTraffic()}<div class="grid">${metric('CGD balance',money(s.balance),'As of '+esc(s.balanceDate))}${metric('Protected reserve',money(s.reserve),'Not available for spending')}${metric('After reserve & pending loan payments',money(cashAbove()),'Before other unpaid expenses',cashAbove()<0?'bad':'good')}${metric('Estimated monthly surplus',money(surplus()),'Before additional repayments',surplus()<0?'bad':'good')}</div>${s.bankSync?box('Bank reconciliation — '+esc(String(s.bankSync.generated_at||'').slice(0,10)),`<p class="muted">Snapshot imported from the Mac. Your iPhone is updated only when you import another encrypted file.</p><div class="grid">${Object.entries(s.bankSync.banks||{}).flatMap(([name,b])=>(b.accounts||[]).map(a=>{const role=s.accountRoles?.[name.toLowerCase()+'|'+a.account_ref]||'unassigned';const amt=(a.balance?.currency==='EUR'&&a.balance?.amount!=null)?money(a.balance.amount):'Unavailable';return metric(name.toUpperCase()+' · '+({current:'Current/debit',credit:'Credit card (not cash)',savings:'Savings',other:'Other',unassigned:'Unidentified'}[role]||'Unidentified'),amt,role==='credit'?'Do not count as cash or assumed card debt':'Account balance');})).join('')}</div><p class="muted">Current account updates the main CGD cash figure once the account is classified. Credit-card balance does not automatically alter the outstanding debt estimate.</p><div class="actions"><a class="button" href="./bank-accounts.html">Review accounts and import</a></div>`):''}${box('Safe allocation check',`<div class="row"><span>Current CGD balance</span><b>${money(s.balance)}</b></div><div class="row"><span>Emergency reserve</span><b>−${money(s.reserve)}</b></div><div class="row"><span>Pending card + Credibom payments</span><b>−${money(unpaid())}</b></div><div class="row"><span>Working buffer (editable)</span><b>−${money(s.workingBuffer)}</b></div><hr><div class="row"><b>Maximum provisional amount above these protections</b><b class="${safe()>0?'good':'bad'}">${money(safe())}</b></div><p class="note">This is NOT a safe-to-spend authorization until all other bills and living costs before your next salary are entered. The October salary is not included in the current balance unless you update it.</p><div class="actions"><button class="primary" data-goto="settings">Update balance & bills</button><button data-goto="budget">Review budget</button></div>`)}${box('Approved October targets',`<div class="grid">${metric('Extra credit-card payment',money(s.cardExtra),'Conditional, not yet paid')}${metric('Scooter allocation',money(s.scooterPlan),'Conditional, not yet transferred')}${metric('Monthly contingency',money(145.01),'Original October plan')}</div><p class="muted">Do not execute additional payments while salary is pending without verifying all upcoming obligations.</p>`)}`;
document.getElementById('budget').innerHTML=`${financeTraffic()}${s.bankSync?box('Actual spending from bank imports',`<div class="grid">${metric('Purchases this month',money(importedMonth().purchases),'Includes uncategorised debits')}${metric('Recognised salary deposits',money(importedMonth().salary),'Detected from descriptions')}${metric('Debt payments seen',money(importedMonth().debt),'Not principal-only')}${metric('Movements requiring review',String(importedMonth().unreviewed),'Check transaction classifications')}</div><p class="muted">Actual spending is based only on imported transactions for ${esc(importedMonth().mm)}. Transfers and debt repayments are excluded; card purchases count as spending, not available credit. Incomplete banking history may understate totals.</p>`):''}${box('Monthly budget assumptions',`<div class="fields">${field('salary','Net salary received in CGD')}${field('food','Food')}${field('transport','Transport & fuel')}${field('misc','Miscellaneous')}${field('meo','MEO')}${field('bankSubs','Bank charges & subscriptions')}${field('cardRegular','Regular Caixa Classic payment')}${field('carRegular','Credibom instalment')}</div><p class="muted">Housing, electricity, water and family health insurance are deducted before the salary reaches CGD; they are not counted again here.</p>`)}<div class="grid">${metric('Monthly expenses',money(monthly()))}${metric('Potential monthly surplus',money(surplus()),'Not verified actual savings',surplus()<0?'bad':'good')}${metric('Projected 12-month surplus',money(surplus()*12),'Excludes extra salaries and unexpected costs')}</div>${box('Expense breakdown',`<div class="tablewrap"><table><tbody>${[['Credibom',s.carRegular],['Credit card',s.cardRegular],['MEO',s.meo],['Bank charges & subscriptions',s.bankSubs],['Food',s.food],['Transport',s.transport],['Miscellaneous',s.misc]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join('')}<tr><th>Total</th><th>${money(monthly())}</th></tr></tbody></table></div>`)}`;
let payoff=(balance,rate,regular,extra)=>{let b=num(balance),months=0,interest=0,p=num(regular)+num(extra);if(p<=b*rate/1200)return null;while(b>0.005&&months<240){let i=b*rate/1200;interest+=i;b=Math.max(0,b+i-p);months++}return {months,interest}};let cardProj=payoff(s.cardBalance,s.cardAPR,s.cardRegular,s.cardExtra),carProj=payoff(s.carBalance,s.carAPR,s.carRegular,0);
document.getElementById('debts').innerHTML=`<div class="grid">${metric('Caixa Classic balance',money(s.cardBalance),'Last entered, not live')}${metric('Credibom balance',money(s.carBalance),'Last entered, not live')}${metric('Combined debt',money(s.cardBalance+s.carBalance),'Before future interest')}</div>${s.debtEstimates?box('Bank-imported debt estimates',`<p class="muted">Estimates calculated from verified reference balances and recognised .mfc payments. These are not lender-confirmed outstanding balances; Caixa Classic may have new purchases and charges.</p><div class="grid">${s.debtEstimates.car?metric('Credibom estimate',money(s.debtEstimates.car.balance),s.debtEstimates.car.matches+' matched payments'):''}${s.debtEstimates.card?metric('Caixa Classic estimate',money(s.debtEstimates.card.balance),s.debtEstimates.card.matches+' matched payments; excludes new purchases'):''}</div><a class="button" href="./bank-accounts.html">Review and recalibrate</a>`):''}${box('Caixa Classic',`<div class="fields">${field('cardBalance','Outstanding balance')}${field('cardAPR','Nominal annual rate (%)')}${field('cardRegular','Regular payment')}${field('cardExtra','Additional monthly payment')}</div><p>Illustrative payoff: <b>${cardProj?cardProj.months+' months':'Payment insufficient to amortise'}</b>${cardProj?' · Approximate interest '+money(cardProj.interest):''}</p><p class="muted">Simplified monthly-interest model, assuming no new purchases and constant payments. Actual revolving minimum payments and fees may vary.</p>`)}${box('Credibom',`<div class="fields">${field('carBalance','Outstanding principal')}${field('carAPR','Reported annual rate (%)')}${field('carRegular','Regular instalment')}</div><p>Illustrative remaining term at regular instalment: <b>${carProj?carProj.months+' months':'Cannot calculate'}</b>.</p><p class="muted">Verify the lender's interest rate, payoff quote and early repayment charges before making extra payments.</p>`)}`;
document.getElementById('goals').innerHTML=`${box('Emergency reserve',`${field('reserve','Protected reserve target')}<div class="bar"><div style="width:${pct(s.balance,s.reserve)}%"></div></div><p class="muted">The reserve is a minimum CGD cash floor, not a separate verified savings account.</p>`)}${box('Scooter fund',`<div class="grid">${metric('Recorded scooter savings',money(s.scooter),'Manually update when actually set aside')}${metric('Target',money(s.scooterTarget),'All-in purchase budget')}${metric('Still needed',money(Math.max(0,s.scooterTarget-s.scooter)),'No borrowing planned')}</div><div class="bar"><div style="width:${pct(s.scooter,s.scooterTarget)}%"></div></div><div class="fields">${field('scooter','Actually set aside')}${field('scooterTarget','All-in scooter target')}${field('scooterPlan','Proposed October contribution')}</div><p class="note">Do not treat planned contributions as saved until transferred or clearly earmarked. Verify age, licensing, insurance and road legality before purchase.</p>`)}${box('Long-term plan',`<p><b>Oct–Nov 2026:</b> protect €5,000, reduce card debt, fund scooter if affordable.</p><p><b>Dec 2026–Mar 2027:</b> aim to eliminate revolving card debt.</p><p><b>Apr–Dec 2027:</b> proposed €500/month extra Credibom repayment, €400/month savings, €176.26/month contingency, subject to updated cash flow and lender conditions.</p>`)}`;
let tx=s.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('transactions').innerHTML=`${box('Transactions and statement import',`<p class="muted">Import a CSV with columns <code>date,description,amount,account,category</code>. Positive amounts are inflows, negative amounts are outflows. Internal transfers should use category <code>Transfer</code> and are excluded from spending totals. Review bank-specific exports before importing; formats vary.</p><input type="file" id="csvFile" accept=".csv,text/csv"><div class="actions"><button id="template">Download CSV template</button><button id="clearTx" class="danger">Clear imported transactions</button></div>`)}${box('Add a transaction',`<div class="fields"><div class="field"><label>Date</label><input id="txDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Description</label><input id="txDescription" placeholder="e.g. Groceries"></div><div class="field"><label>Amount (€)</label><input id="txAmount" type="number" step=".01" placeholder="-25.00"></div><div class="field"><label>Account</label><select id="txAccount"><option>CGD</option><option>Revolut</option><option>Other</option></select></div><div class="field"><label>Category</label><select id="txCategory"><option>Food</option><option>Transport</option><option>Bills</option><option>Debt payment</option><option>Salary</option><option>Transfer</option><option>Savings</option><option>Other</option></select></div></div><button class="primary" id="addTx">Add transaction</button>`)}${box('Imported transactions',`<p class="muted">${tx.length} transactions · Expenses excluding transfers and debt payments: ${money(-tx.filter(t=>num(t.amount)<0&&!['Transfer','Debt payment','Savings'].includes(t.category)).reduce((a,t)=>a+num(t.amount),0))}</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Account</th><th>Category</th><th>Amount</th></tr></thead><tbody>${tx.slice(0,150).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.description)}</td><td>${esc(t.account)}</td><td>${t.import_id?`<select data-tx-cat="${esc(t.import_id)}" aria-label="Transaction category">${["Uncategorised","Card purchase / review","Food","Transport","Bills","Salary","Debt payment","Transfer","Savings","Other"].map(z=>`<option value="${z}" ${t.category===z?"selected":""}>${z}</option>`).join("")}</select>`:esc(t.category)}</td><td>${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`)}`;
let checks=[['salary','20–21: Check salary deposit'],['review','22: Review CGD balance and budget'],['card','Verify Caixa Classic repayment'],['credibom','Verify Credibom instalment'],['reserve','Confirm emergency reserve intact'],['scooter','Review scooter funding'],['monthend','Month-end: Import transactions and reconcile']];document.getElementById('reminders').innerHTML=`${box('Financial review calendar',`<p><b>20–21 each month:</b> salary usually arrives.</p><p><b>22 each month:</b> update balance, verify payments, recalculate available cash, review debt and scooter goals.</p><p><b>Month-end:</b> import statements and reconcile transactions.</p><p class="note">This offline app does not send background push notifications. Your existing ChatGPT reminder for 22 October 2026 remains separate. You can export calendar reminders below.</p><button class="primary" id="calendar">Download monthly calendar reminders (.ics)</button>`)}${box('Monthly checklist',checks.map(([id,t])=>`<label class="check"><input type="checkbox" data-check="${id}" ${s.reminders[id]?'checked':''}> ${t}</label>`).join('')+`<div class="actions"><button id="resetChecks">Reset checklist for next month</button></div>`)}`;
document.getElementById('settings').innerHTML=`${box('Cash position and verification',`<div class="fields">${field('balance','Current CGD available balance')}${field('workingBuffer','Minimum additional working buffer')}</div><div class="field"><label>Balance observation date</label><input id="balanceDate" type="date" value="${esc(s.balanceDate)}"></div><label class="check"><input type="checkbox" data-bool="cardPaid" ${s.cardPaid?'checked':''}> Current Caixa Classic payment already deducted</label><label class="check"><input type="checkbox" data-bool="carPaid" ${s.carPaid?'checked':''}> Current Credibom instalment already deducted</label><label class="check"><input type="checkbox" data-bool="salaryArrived" ${s.salaryArrived?'checked':''}> Salary included in the CGD balance</label><p class="muted">When salary arrives, enter the NEW total CGD balance. Do not add salary again automatically; that would double count.</p>`)}${box('Backup and privacy',`<p>Your data is stored in this browser on this device. Clearing browser data, using private mode or switching devices can erase it. Export backups regularly. No bank credentials are collected.</p><div class="actions"><button class="primary" id="export">Export JSON backup</button><label class="button">Restore JSON backup <input id="restore" type="file" accept="application/json,.json" style="max-width:180px"></label><button id="exportCsv">Export transactions CSV</button></div><p class="muted">This is a planning tool, not a regulated financial service. No payments are initiated by the app.</p>`)}`;}
function download(name,content,type){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvRow(a){return a.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')}function parseCSV(text){let rows=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function bind(){document.querySelectorAll('[data-payment]').forEach(el=>el.addEventListener('click',()=>{const label=el.dataset.payment,mm=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'),current=paymentTraffic().statuses.find(x=>x.label===label);if(!current||current.detected&&!current.manual)return;state.paymentConfirmations=state.paymentConfirmations||{};state.paymentConfirmations[mm]=state.paymentConfirmations[mm]||{};if(current.manual)delete state.paymentConfirmations[mm][label];else if(confirm('Confirmas que a prestação de '+label+' foi efetivamente paga? Esta confirmação é manual e não altera o saldo bancário nem a dívida.'))state.paymentConfirmations[mm][label]={confirmedAt:new Date().toISOString(),amount:current.expected};save();render();bind()}));document.querySelectorAll('[data-tx-cat]').forEach(el=>el.addEventListener('change',()=>{const t=state.transactions.find(x=>x.import_id===el.dataset.txCat);if(t){t.category=el.value;save();render();bind()}}));document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{state[el.dataset.field]=num(el.value);save();render();bind()}));document.querySelectorAll('[data-bool]').forEach(el=>el.addEventListener('change',()=>{state[el.dataset.bool]=el.checked;save();render();bind()}));document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{state.reminders[el.dataset.check]=el.checked;save()}));document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>show(el.dataset.goto)));let d=document.getElementById('balanceDate');if(d)d.onchange=()=>{state.balanceDate=d.value;save()};let add=document.getElementById('addTx');if(add)add.onclick=()=>{let date=document.getElementById('txDate').value,description=document.getElementById('txDescription').value,amount=document.getElementById('txAmount').value;if(!date||!description||amount===''){alert('Enter date, description and amount');return}state.transactions.push({date,description,amount:num(amount),account:document.getElementById('txAccount').value,category:document.getElementById('txCategory').value});save();render();bind()};let f=document.getElementById('csvFile');if(f)f.onchange=async()=>{let rows=parseCSV(await f.files[0].text());let head=rows.shift().map(x=>x.trim().toLowerCase());if(!['date','description','amount'].every(k=>head.includes(k))){alert('CSV must include date,description,amount headers. Download the template.');return}let imported=0;for(let r of rows){let o=Object.fromEntries(head.map((k,i)=>[k,r[i]??'']));let amount=Number(o.amount);if(!o.date||!o.description||!Number.isFinite(amount))continue;let t={date:o.date,description:o.description,amount,account:o.account||'Unknown',category:o.category||'Other'};if(!state.transactions.some(x=>JSON.stringify(x)===JSON.stringify(t))){state.transactions.push(t);imported++}}save();render();bind();alert('Imported '+imported+' transactions. Review categories and duplicates.')};let t=document.getElementById('template');if(t)t.onclick=()=>download('finance_template.csv','date,description,amount,account,category\n2026-10-21,Example groceries,-25.00,CGD,Food\n','text/csv');let cl=document.getElementById('clearTx');if(cl)cl.onclick=()=>{if(confirm('Delete all imported transactions? Export a backup first.')){state.transactions=[];save();render();bind()}};let reset=document.getElementById('resetChecks');if(reset)reset.onclick=()=>{state.reminders={};save();render();bind()};let exp=document.getElementById('export');if(exp)exp.onclick=()=>download('finance-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');let restore=document.getElementById('restore');if(restore)restore.onchange=async()=>{try{let x=JSON.parse(await restore.files[0].text());if(!('balance'in x)||!('reserve'in x))throw Error('Invalid backup');if(confirm('Replace local app data with backup?')){state={...defaults,...x};save();render();bind()}}catch(e){alert('Could not restore: '+e.message)}};let ec=document.getElementById('exportCsv');if(ec)ec.onclick=()=>download('finance-transactions.csv',[csvRow(['date','description','amount','account','category']),...state.transactions.map(t=>csvRow([t.date,t.description,t.amount,t.account,t.category]))].join('\n'),'text/csv');let cal=document.getElementById('calendar');if(cal)cal.onclick=()=>{let dt='20261022T150000',events=[['Monthly CGD financial review','FREQ=MONTHLY;BYMONTHDAY=22','Review salary, CGD balance, bills, emergency reserve, debts and scooter goal.'],['Monthly statement reconciliation','FREQ=MONTHLY;BYMONTHDAY=-1','Import statements, categorise spending and verify balances.']];let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//My Finance Control//EN\r\n'+events.map((e,i)=>`BEGIN:VEVENT\r\nUID:finance-${i}@local\r\nDTSTAMP:20261010T120000Z\r\nDTSTART;TZID=Atlantic/Azores:${i===0?dt:'20261031T180000'}\r\nRRULE:${e[1]}\r\nSUMMARY:${e[0]}\r\nDESCRIPTION:${e[2]}\r\nEND:VEVENT\r\n`).join('')+'END:VCALENDAR\r\n';download('financial-reminders.ics',ics,'text/calendar')};}
function show(tab){document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hide',x.id!==tab));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));window.scrollTo(0,0)}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));render();bind();
</script></body></html>
