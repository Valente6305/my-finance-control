<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>My Finance Control · Modern</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="manifest" href="manifest.webmanifest"><style>
:root{
 --navy:#0b1f33;--navy2:#123a5a;--blue:#1976d2;--blue-soft:#eaf3ff;
 --green:#11865b;--green-soft:#e8f7f0;--red:#c43d4d;--red-soft:#fff0f2;

 --ink:#14283c;--muted:#6d7e8e;--line:#dce5ed;--bg:#eef3f7;--white:#fff;
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#edf3f8 0,#f7f9fb 320px,#f3f6f8 100%);min-height:100vh}
header{background:linear-gradient(135deg,var(--navy) 0%,#123b5c 58%,#1e5d7c 100%);color:#fff;padding:30px max(18px,calc((100vw - 1160px)/2));box-shadow:0 10px 30px rgba(11,31,51,.18)}
header h1{margin:0;font-size:1.85rem;letter-spacing:-.025em}header p{margin:7px 0 0;color:#cfe0ef;font-size:.95rem}
main{max-width:1160px;margin:auto;padding:20px 14px 60px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 22px;position:sticky;top:0;z-index:15;padding:10px 0;background:rgba(244,247,249,.92);backdrop-filter:blur(12px)}
.tabs button,.button{border:1px solid #d5e0e9;border-radius:999px;padding:10px 15px;background:#fff;color:#28445d;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;transition:.18s ease;box-shadow:0 2px 7px rgba(22,50,72,.05)}
.tabs button:hover,.button:hover{transform:translateY(-1px);border-color:#aac2d5}
.tabs .active{background:var(--navy);border-color:var(--navy);color:#fff}.button.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 7px 24px rgba(30,55,77,.07)}
.card h2{font-size:1.08rem;margin:0 0 15px;letter-spacing:-.01em}.card h3{margin:0 0 8px}
.card.accent-green{border-top:4px solid var(--green)}.card.accent-red{border-top:4px solid var(--red)}.card.accent-amber{border-top:4px solid var(--amber)}.card.accent-purple{border-top:4px solid var(--purple)}.card.accent-blue{border-top:4px solid var(--blue)}
.metric{position:relative;overflow:hidden;min-height:142px;padding:20px}.metric:after{content:"";position:absolute;width:92px;height:92px;border-radius:50%;right:-32px;top:-30px;background:currentColor;opacity:.07}
.metric small{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.055em;font-size:.72rem}
.metric strong{font-size:1.85rem;display:block;margin:10px 0 7px;letter-spacing:-.035em;color:var(--ink)}
.metric.good{border-top:4px solid var(--green);background:linear-gradient(145deg,#fff,var(--green-soft))}
.metric.debt{border-top:4px solid var(--red);background:linear-gradient(145deg,#fff,var(--red-soft))}
.metric.attention{border-top:4px solid var(--amber);background:linear-gradient(145deg,#fff,var(--amber-soft))}
.metric.info{border-top:4px solid var(--blue);background:linear-gradient(145deg,#fff,var(--blue-soft))}
.metric.intel{border-top:4px solid var(--purple);background:linear-gradient(145deg,#fff,var(--purple-soft))}
.muted{color:var(--muted);font-size:.88rem;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:10px 0;border-bottom:1px solid #edf1f4;flex-wrap:wrap}.row:last-child{border:0}.row strong{text-align:right}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.status{border-left:0;border-top:4px solid var(--amber)}.status.ok{border-top-color:var(--green)}.status.bad{border-top-color:var(--red)}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:.74rem;font-weight:800;letter-spacing:.02em}
.badge.good{background:var(--green-soft);color:var(--green)}.badge.warn{background:var(--amber-soft);color:var(--amber)}.badge.bad{background:var(--red-soft);color:var(--red)}.badge.info{background:var(--blue-soft);color:var(--blue)}.badge.purple{background:var(--purple-soft);color:var(--purple)}
.progress{height:10px;background:#e8edf2;border-radius:999px;overflow:hidden;margin:8px 0 3px}.progress>span{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#4ea5ee)}.progress.good>span{background:linear-gradient(90deg,var(--green),#48b98a)}.progress.bad>span{background:linear-gradient(90deg,var(--red),#e36f7c)}
.debt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:16px}.debt-card{background:#fff;border:1px solid #f0cdd2;border-radius:18px;padding:18px;box-shadow:0 7px 20px rgba(100,35,45,.06);border-top:4px solid var(--red)}
.goal-card{padding:14px 0;border-bottom:1px solid #edf1f4}.goal-card:last-child{border-bottom:0}.goal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}
label{display:block;margin:10px 0;font-weight:650;color:#3d5367}input,select{width:100%;padding:10px 11px;border:1px solid #b9c8d4;border-radius:10px;font:inherit;background:#fbfcfd;color:var(--ink);outline:none}input:focus,select:focus{border-color:#5d9ed3;box-shadow:0 0 0 3px rgba(25,118,210,.12)}
button{font:inherit}.action{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:10px 14px;cursor:pointer;font-weight:700}.action:hover{filter:brightness(1.08)}.danger{background:var(--red)}
.scroll{overflow:auto;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #e7edf2}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f7f9fb}
details{margin-top:12px}footer{text-align:center;color:#7d8b98;font-size:.8rem;padding:18px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173d37;color:#fff;border-radius:12px;padding:12px 20px;display:none;z-index:30;box-shadow:0 8px 28px rgba(0,0,0,.2)}
@media(max-width:640px){header{padding-top:24px;padding-bottom:24px}.metric{min-height:125px}.tabs{position:static}.row strong{text-align:left}.debt-grid{grid-template-columns:1fr}}

.mobile-nav,.mobile-sheet{display:none}
@media(max-width:700px){
 body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
 header{padding:20px 16px 18px}
 header h1{font-size:1.45rem}
 header p{font-size:.85rem}
 main{padding:12px 10px 28px}
 .tabs{display:none}
 .grid{grid-template-columns:1fr;gap:10px}
 .card{border-radius:15px;padding:16px;margin-bottom:12px}

 .metric strong{font-size:1.62rem}
 .debt-grid{grid-template-columns:1fr;gap:10px}

 .row>span,.row>strong{width:100%;text-align:left}
 .action,.button{min-height:44px}

 .mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid #d9e3eb;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(20,40,60,.12)}
 .mobile-nav button{border:0;background:transparent;color:#607487;padding:5px 2px;font-size:.69rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
 .mobile-nav button .ico{font-size:1.25rem;line-height:1}
 .mobile-nav button.active{color:var(--blue)}
 .mobile-sheet{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:60;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 18px 50px rgba(15,35,55,.24)}
 .mobile-sheet.open{display:block}
 .mobile-sheet a,.mobile-sheet button{display:flex;width:100%;align-items:center;gap:10px;padding:13px;border:0;background:transparent;border-radius:10px;color:var(--ink);text-decoration:none;font:inherit;font-weight:700;text-align:left}
 .mobile-sheet a:hover,.mobile-sheet button:hover{background:#f2f6f9}
 .mobile-sheet .sep{height:1px;background:#e8edf1;margin:5px 0}
 .scroll{margin-left:-2px;margin-right:-2px}
 table{min-width:640px}
}

<div id="toast"></div><script>
'use strict';
const KEY='finance-control-public-v2';
const defaults={salary:0,balance:0,balanceDate:'',reserve:0,cardBalance:0,cardAPR:0,cardRegular:231.25,carBalance:0,carAPR:0,carRegular:210.74,meo:0,bankSubs:0,food:0,transport:0,misc:0,workingBuffer:0,transactions:[],paymentConfirmations:{},goals:[]};
let state=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast('Guardado neste dispositivo')}
const n=v=>Number(v)||0,eur=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n(v)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const month=d=>String(d||'').slice(0,7),currentMonth=()=>new Date().toISOString().slice(0,7),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const txkey=t=>t.import_id||[t.date,t.account,t.description,t.amount].join('|');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function transactions(){const m=new Map();for(const t of state.transactions||[]){if(!t||!/^\d{4}-\d{2}-\d{2}/.test(String(t.date||''))||!Number.isFinite(Number(t.amount)))continue;const k=txkey(t);if(!m.has(k))m.set(k,t)}return [...m.values()]}
function isTransfer(t){return t.category==='Transfer'||/TRANSFERENCIA ENTRE CONTAS|REVOLUT TOP UP|TRANSFER TO OWN/.test(norm(t.description))}
function isDebt(t){return t.category==='Debt payment'||/CREDIBOM|CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/.test(norm(t.description))}
function regularSalaryCandidates(){
 const seed=n(state.salary)||2096.22;
 return transactions().filter(t=>n(t.amount)>0&&/^T(F|R)I?\s+ASSOCIACAO\s+RAEGE$/.test(norm(t.description).replace(/\s+/g,' ').trim())).filter(t=>{const a=n(t.amount);return a>=seed*.7&&a<=seed*1.35})
}
function isSalary(t){return regularSalaryCandidates().some(x=>txkey(x)===txkey(t))}
function monthlySpend(mm=currentMonth()){const bank=transactions().filter(t=>month(t.date)===mm&&n(t.amount)<0&&!isTransfer(t)&&!isDebt(t)).reduce((a,t)=>a-n(t.amount),0),pay=payrollDeductions(mm);return bank+pay.total}
function salaryDetected(){const seed=n(state.salary)||2096.22,c=regularSalaryCandidates().filter(t=>month(t.date)===currentMonth());if(!c.length)return 0;return n(c.sort((a,b)=>Math.abs(n(a.amount)-seed)-Math.abs(n(b.amount)-seed))[0].amount)}
function paymentStatus(name,amount,re){const mm=currentMonth(),manual=state.paymentConfirmations?.[mm]?.[name];const hits=transactions().filter(t=>month(t.date)===mm&&n(t.amount)<0&&re.test(norm(t.description))&&Math.abs(-n(t.amount)-amount)<=1);return {name,amount,detected:hits.length>0||!!manual,bank:hits.length>0,manual:!hits.length&&!!manual}}
function paymentStatuses(){return [paymentStatus('Credibom',n(state.carRegular)||210.74,/CREDIBOM/),paymentStatus('Caixa Classic',n(state.cardRegular)||231.25,/CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/)]}
function budgetTotal(){return n(state.food)+n(state.transport)+n(state.meo)+n(state.bankSubs)+n(state.misc)}
function migrateGoal(){if((state.goals||[]).length===0&&n(state.scooterTarget)>0){state.goals=[{id:'legacy-scooter',name:'Trotinete',target:n(state.scooterTarget),saved:n(state.scooter)}];save()}}
migrateGoal();
function migratePayrollDeductions(){
 state.payrollDeductions=state.payrollDeductions||{};
 if(!state.payrollDeductions['2026-10'])state.payrollDeductions['2026-10']={source:'Vencimento VAC 10 2026.xlsx',confirmed:true,preDeductionNet:2606.10,bankNet:2086.34,items:[
  {key:'rent',label:'Renda / Moradia',category:'Habitação e serviços',amount:306.57},
  {key:'electricity',label:'Eletricidade',category:'Habitação e serviços',amount:39.77},
  {key:'water',label:'Água',category:'Habitação e serviços',amount:21.42},
  {key:'health',label:'Seguro de saúde',category:'Saúde',amount:152.00}
 ]};
 if(!state.payrollDeductionProfile)state.payrollDeductionProfile={sourceMonth:'2026-10',preDeductionNetReference:2606.10,items:state.payrollDeductions['2026-10'].items.map(x=>({...x}))};
 save();
}
function automaticSafetyMargin(){
 const pay=payrollDeductions(),essential=pay.total+n(state.food)+n(state.transport)+n(state.meo)+n(state.bankSubs)+n(state.carRegular)+n(state.cardRegular);
 return {essential,margin:Math.max(300,Math.round(essential*.10*100)/100)};
}
function payrollDeductions(mm=currentMonth()){
 const exact=state.payrollDeductions?.[mm];if(exact)return {...exact,estimated:false,total:exact.items.reduce((a,x)=>a+n(x.amount),0)};
 const p=state.payrollDeductionProfile;if(!p)return {items:[],total:0,estimated:true};
 return {source:'Perfil recorrente de '+p.sourceMonth,estimated:true,preDeductionNet:p.preDeductionNetReference,items:p.items.map(x=>({...x})),total:p.items.reduce((a,x)=>a+n(x.amount),0)};
}
migratePayrollDeductions();
const metric=(a,b,c='',tone='info')=>'<div class="card metric '+tone+'"><small>'+a+'</small><strong>'+b+'</strong><span class="muted">'+c+'</span></div>';
const badge=(t,tone='info')=>'<span class="badge '+tone+'">'+t+'</span>';
const progress=(v,tone='')=>'<div class="progress '+tone+'"><span style="width:'+Math.max(0,Math.min(100,n(v)))+'%"></span></div>';
const row=(a,b)=>'<div class="row"><span>'+a+'</span><strong>'+b+'</strong></div>';
const field=(key,label,value,step='.01')=>'<label>'+label+'<input data-field="'+key+'" type="number" step="'+step+'" value="'+n(value)+'"></label>';
function renderOverview(){
 const payroll=payrollDeductions(),spent=monthlySpend(),budget=budgetTotal()+payroll.total,salary=salaryDetected(),payments=paymentStatuses(),pending=payments.reduce((a,p)=>a+(p.detected?0:p.amount),0),available=n(state.balance)-n(state.reserve)-pending,age=state.bankSync?.generated_at?Math.floor((Date.now()-new Date(state.bankSync.generated_at))/86400000):null;
 const reservePct=n(state.reserve)?Math.min(100,n(state.balance)/n(state.reserve)*100):0,budgetPct=budget?spent/budget*100:0;
 document.getElementById('overview').innerHTML=
 '<div class="grid">'+
 metric('Dinheiro disponível',eur(state.balance),state.balanceDate?'Atualizado '+esc(state.balanceDate):'Saldo de referência','info')+
 metric('Reserva protegida',eur(state.reserve),reservePct>=100?'Objetivo coberto':'Cobertura atual '+pct(reservePct/100),reservePct>=100?'good':'attention')+
 metric('Execução do mês',budget?pct(spent/budget):'—',eur(spent)+' de '+eur(budget),budgetPct<=100?'good':'debt')+
 metric('Livre acima da reserva',eur(available),'Após compromissos ainda pendentes',available>=0?'good':'debt')+
 '</div>'+
 '<div class="card accent-blue"><h2>Estado financeiro do mês</h2>'+
 row('Sincronização bancária',age===null?badge('Sem importação','warn'):age<=2?badge('Atualizada · '+age+' dia(s)','good'):badge('Desatualizada · '+age+' dias','warn'))+
 row('Crédito salarial',salary>0?badge('Detetado','good')+' '+eur(salary):badge('Ainda não detetado','warn'))+
 row('Deduções no vencimento',payroll.total?eur(payroll.total)+' '+(payroll.estimated?badge('Estimativa','warn'):badge('Confirmado','good')):'—')+
 row('Rendimento antes das deduções',salary>0?eur(salary+payroll.total):'—')+
 '</div>'+
 '<div class="card accent-green"><h2>Pagamentos do mês</h2>'+payments.map(p=>row(esc(p.name),(p.bank?badge('Identificado no banco','good'):p.manual?badge('Confirmado manualmente','good'):badge('Por confirmar','warn'))+'<div style="margin-top:8px"><button class="action" data-pay="'+esc(p.name)+'">'+(p.manual?'Anular confirmação':p.detected?'Confirmado':'Confirmar pagamento')+'</button></div>')).join('')+'</div>'+
 '<div class="card accent-purple"><h2>Próxima decisão</h2><p class="muted">Património, amortização antecipada, projeções e saúde financeira estão concentrados na Financial Intelligence.</p><a class="button primary" href="./financial-intelligence.html?v=mobile-1">Abrir Intelligence v7 →</a></div>';
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>togglePayment(b.dataset.pay));
}
const pct=v=>(100*v).toFixed(1)+'%';
function monthlyExpenseSummary(){
 const pay=payrollDeductions();
 const fixed=pay.total+n(state.meo)+n(state.bankSubs)+n(state.carRegular)+n(state.cardRegular);
 const variable=n(state.food)+n(state.transport)+n(state.misc);
 return {pay,fixed,variable,total:fixed+variable};
}
function renderBudget(){
 const x=monthlyExpenseSummary(),pay=x.pay,opBudget=budgetTotal()+pay.total,exec=opBudget?monthlySpend()/opBudget*100:0;
 document.getElementById('budget').innerHTML=
 '<div class="grid">'+
 metric('Fixas / recorrentes',eur(x.fixed),'Compromissos mensais','debt')+
 metric('Variáveis previstas',eur(x.variable),'Alimentação · transportes · outros','attention')+
 metric('Total mensal',eur(x.total),'Referência atual','info')+
 metric('Execução operacional',opBudget?pct(monthlySpend()/opBudget):'—',eur(monthlySpend())+' realizado',exec<=100?'good':'debt')+
 '</div>'+
 '<div class="card accent-blue"><h2>Orçamento mensal operacional</h2><div class="grid">'+
 field('food','Alimentação (€)',state.food)+field('transport','Transportes (€)',state.transport)+field('meo','Comunicações (€)',state.meo)+field('bankSubs','Serviços bancários (€)',state.bankSubs)+field('misc','Outros (€)',state.misc)+
 '</div><button class="action" id="saveBudget">Guardar orçamento</button></div>'+
 '<div class="card accent-amber"><h2>Composição do mês</h2>'+
 row('Orçamento bancário planeado',eur(budgetTotal()))+
 row('Deduções no vencimento',eur(pay.total)+' '+(pay.estimated?badge('Estimativa','warn'):badge('Confirmado','good')))+
 row('Compromissos de dívida',eur(n(state.carRegular)+n(state.cardRegular)))+
 row('Total mensal de referência',eur(x.total))+
 progress(exec,exec<=100?'good':'bad')+
 '</div>';
 bindFields();document.getElementById('saveBudget').onclick=()=>{save();renderAll()}
}
function renderDebts(){
 const goals=state.goals||[],car=state.debtEstimates?.car,card=state.debtEstimates?.card,carBal=car?n(car.balance):n(state.carBalance),cardBal=card?n(card.balance):n(state.cardBalance);
 document.getElementById('debts').innerHTML=
 '<div class="debt-grid">'+
 '<div class="debt-card"><div class="goal-head"><h2>Caixa Classic</h2>'+badge(cardBal>0?'Prioridade alta':'Liquidado',cardBal>0?'bad':'good')+'</div>'+
 row('Saldo estimado',eur(cardBal))+row('Pagamento mensal',eur(state.cardRegular))+row('Taxa anual',n(state.cardAPR).toFixed(2)+'%')+
 (card?row('Pagamentos identificados',card.matches+' · '+eur(card.payments))+row('Atualizado até',esc(card.asOf)):'')+
 '<p class="muted">Crédito revolving. Evitar novas utilizações enquanto existir saldo.</p></div>'+
 '<div class="debt-card"><div class="goal-head"><h2>Credibom</h2>'+badge(carBal>0?'Em amortização':'Liquidado',carBal>0?'warn':'good')+'</div>'+
 row('Saldo estimado',eur(carBal))+row('Prestação',eur(state.carRegular))+row('Taxa anual',n(state.carAPR).toFixed(2)+'%')+
 (car?row('Pagamentos identificados',car.matches+' · '+eur(car.payments))+row('Atualizado até',esc(car.asOf)):'')+
 '</div></div>'+
 '<div class="card accent-red"><h2>Parâmetros das dívidas</h2><div class="grid">'+field('carAPR','Credibom · taxa anual (%)',state.carAPR)+field('carRegular','Credibom · prestação (€)',state.carRegular)+field('cardAPR','Caixa Classic · taxa anual (%)',state.cardAPR)+field('cardRegular','Caixa Classic · pagamento mensal (€)',state.cardRegular)+'</div><button class="action" id="saveDebts">Guardar taxas/prestações</button> <a class="button" href="./bank-accounts.html">Calibrar saldos →</a></div>'+
 '<div class="card accent-green"><div class="goal-head"><h2>Objetivos</h2>'+badge(goals.length+' ativo(s)','info')+'</div>'+
 (goals.length?goals.map((g,i)=>{const pc=n(g.target)?Math.min(100,n(g.saved)/n(g.target)*100):0;return '<div class="goal-card"><div class="goal-head"><strong>'+esc(g.name)+'</strong><span>'+eur(g.saved)+' / '+eur(g.target)+'</span></div>'+progress(pc,'good')+'<div class="grid"><label>Nome<input data-goal-name="'+i+'" value="'+esc(g.name)+'"></label><label>Reservado (€)<input data-goal-saved="'+i+'" type="number" step=".01" value="'+n(g.saved)+'"></label><label>Meta (€)<input data-goal-target="'+i+'" type="number" step=".01" value="'+n(g.target)+'"></label></div><button class="action danger" data-goal-remove="'+i+'">Remover</button></div>'}).join(''):'<p class="muted">Sem objetivos ativos.</p>')+
 '<div style="margin-top:14px"><button class="action" id="addGoal">Adicionar objetivo</button> <button class="action" id="saveGoals">Guardar objetivos</button></div></div>';
 bindFields();document.getElementById('saveDebts').onclick=()=>{save();renderAll()};document.getElementById('addGoal').onclick=()=>{state.goals=[...(state.goals||[]),{id:'g'+Date.now(),name:'Novo objetivo',saved:0,target:0}];save();renderAll()};document.getElementById('saveGoals').onclick=saveGoals;document.querySelectorAll('[data-goal-remove]').forEach(b=>b.onclick=()=>{state.goals.splice(Number(b.dataset.goalRemove),1);save();renderAll()});
}
function saveGoals(){document.querySelectorAll('[data-goal-name]').forEach(e=>state.goals[+e.dataset.goalName].name=e.value.trim()||'Objetivo');document.querySelectorAll('[data-goal-saved]').forEach(e=>state.goals[+e.dataset.goalSaved].saved=n(e.value));document.querySelectorAll('[data-goal-target]').forEach(e=>state.goals[+e.dataset.goalTarget].target=n(e.value));save();renderAll()}
function renderTransactions(){
 const list=transactions().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,100);
 document.getElementById('transactions').innerHTML='<div class="card"><h2>Ajuste manual</h2><p class="muted">Usa apenas para dinheiro, correções ou movimentos que não chegam pela importação bancária.</p><div class="grid"><label>Data<input id="txDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Descrição<input id="txDesc" type="text"></label><label>Valor (€; negativo = despesa)<input id="txAmount" type="number" step=".01"></label></div><button class="action" id="addTx">Adicionar ajuste</button></div><div class="card"><h2>Movimentos recentes</h2><div class="scroll"><table><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Origem</th></tr></thead><tbody>'+list.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.description||'')+'</td><td>'+eur(t.amount)+'</td><td>'+(t.import_id?'Banco':'Manual')+'</td></tr>').join('')+'</tbody></table></div></div>';
 document.getElementById('addTx').onclick=()=>{const date=document.getElementById('txDate').value,description=document.getElementById('txDesc').value.trim(),amount=Number(document.getElementById('txAmount').value);if(!date||!description||!Number.isFinite(amount))return toast('Preenche data, descrição e valor');state.transactions=[...(state.transactions||[]),{date,description,amount,category:'Manual'}];save();renderAll()};
}
function renderSettings(){
 const sm=automaticSafetyMargin();document.getElementById('settings').innerHTML='<div class="card"><h2>Configuração essencial</h2><div class="grid">'+field('reserve','Reserva de emergência (€)',state.reserve)+'</div>'+row('Margem de segurança automática',eur(sm.margin))+row('Base: despesas essenciais mensais',eur(sm.essential))+'<p class="muted">A margem é calculada automaticamente como 10% das despesas essenciais, com mínimo de 300 €. É uma almofada operacional adicional à reserva de emergência.</p><p class="muted">O rendimento mensal é inferido automaticamente dos movimentos bancários classificados como salário.</p><button class="action" id="saveSettings">Guardar</button></div>'+
 '<div class="card"><h2>Dados e segurança</h2><button class="action" id="exportJson">Exportar backup JSON</button><p class="muted">Para backup encriptado e auditoria usa Intelligence v7.</p><details><summary>Advanced · manutenção de dados</summary><p class="muted">Utiliza apenas se souberes exatamente o que estás a fazer.</p><button class="action danger" id="clearImported">Remover movimentos bancários importados deste dispositivo</button></details></div>';
 bindFields();document.getElementById('saveSettings').onclick=()=>{save();renderAll()};document.getElementById('exportJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-finance-control-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('clearImported').onclick=()=>{if(!confirm('Remover apenas os movimentos bancários importados deste dispositivo? Ajustes manuais serão preservados.'))return;state.transactions=(state.transactions||[]).filter(t=>!t.import_id);delete state.bankSync;save();renderAll()};
}
function bindFields(){document.querySelectorAll('[data-field]').forEach(e=>e.onchange=()=>{state[e.dataset.field]=n(e.value)})}
function togglePayment(name){const mm=currentMonth();state.paymentConfirmations=state.paymentConfirmations||{};state.paymentConfirmations[mm]=state.paymentConfirmations[mm]||{};if(state.paymentConfirmations[mm][name])delete state.paymentConfirmations[mm][name];else state.paymentConfirmations[mm][name]={amount:name==='Credibom'?n(state.carRegular)||210.74:n(state.cardRegular)||231.25,confirmedAt:new Date().toISOString()};save();renderAll()}
function renderAll(){state=load();renderOverview();renderBudget();renderDebts();renderTransactions();renderSettings()}
function activateTab(tab){
 document.querySelectorAll('main>section').forEach(sec=>sec.classList.add('hide'));
 const target=document.getElementById(tab);if(target)target.classList.remove('hide');
 document.querySelectorAll('#tabs button[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 document.querySelectorAll('#mobileNav [data-mobile-tab]').forEach(x=>x.classList.toggle('active',x.dataset.mobileTab===tab));
 const sheet=document.getElementById('mobileSheet');if(sheet){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true')}
 window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('tabs').querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>activateTab(b.dataset.tab));
document.querySelectorAll('[data-mobile-tab]').forEach(b=>b.onclick=()=>activateTab(b.dataset.mobileTab));
const moreBtn=document.querySelector('[data-mobile-more]'),sheet=document.getElementById('mobileSheet');
if(moreBtn&&sheet)moreBtn.onclick=()=>{const open=sheet.classList.toggle('open');sheet.setAttribute('aria-hidden',String(!open));moreBtn.classList.toggle('active',open)};
document.addEventListener('click',e=>{if(sheet?.classList.contains('open')&&!sheet.contains(e.target)&&!moreBtn.contains(e.target)){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');moreBtn.classList.remove('active')}});
renderAll();window.addEventListener('pageshow',renderAll);window.addEventListener('focus',renderAll);document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderAll()});window.addEventListener('storage',e=>{if(e.key===KEY)renderAll()});
</script></body></html>
