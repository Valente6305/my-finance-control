<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>My Finance Control</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172b3c;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:#fff;padding:24px max(18px,calc((100vw - 1080px)/2))}header h1{margin:0;font-size:1.6rem}header p{margin:6px 0 0;color:#d3deea}main{max-width:1080px;margin:auto;padding:16px 14px 50px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button,.button{border:0;border-radius:8px;padding:10px 13px;background:#dfe7ee;color:#173049;font:inherit;cursor:pointer;text-decoration:none}.tabs .active,.button.primary{background:#10243a;color:white}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dde5ec;border-radius:13px;padding:17px;margin-bottom:14px}.metric strong{font-size:1.55rem;display:block;margin:5px 0}.muted{color:#65798b;font-size:.88rem}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf0f2;flex-wrap:wrap}.row:last-child{border:0}.ok{color:#16724f}.warn{color:#9c600e}.bad{color:#a72b36}.status{border-left:6px solid #bd7a16}.status.ok{border-left-color:#18845e}.status.bad{border-left-color:#b42332}label{display:block;margin:9px 0}input,select{width:100%;padding:9px;border:1px solid #aab9c7;border-radius:7px;font:inherit}button{font:inherit}.action{border:0;border-radius:8px;background:#10243a;color:#fff;padding:10px 13px;cursor:pointer}.danger{background:#9f2632}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #e7ebef}details{margin-top:12px}footer{text-align:center;color:#748294;font-size:.8rem;padding:16px}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#173d37;color:#fff;border-radius:9px;padding:11px 18px;display:none;z-index:20}
</style></head><body><header><h1>◈ My Finance Control</h1><p>Controlo financeiro pessoal · EUR · dados locais</p></header><main><nav class="tabs" id="tabs"><button class="active" data-tab="overview">Overview</button><button data-tab="budget">Budget</button><button data-tab="debts">Debts & Goals</button><button data-tab="transactions">Transactions</button><button data-tab="settings">Settings</button><a class="button primary" href="./bank-accounts.html">Accounts ↗</a><a class="button primary" href="./financial-intelligence.html">Intelligence v7 ↗</a></nav><section id="overview"></section><section id="budget" class="hide"></section><section id="debts" class="hide"></section><section id="transactions" class="hide"></section><section id="settings" class="hide"></section><footer>Dados privados neste dispositivo · saldos importados não são tempo real · estimativas não substituem confirmações bancárias</footer></main><div id="toast"></div><script>
'use strict';
const KEY='finance-control-public-v2';
const defaults={salary:0,balance:0,balanceDate:'',reserve:0,cardBalance:0,cardAPR:0,cardRegular:231.25,carBalance:0,carAPR:0,carRegular:210.74,meo:0,bankSubs:0,food:0,transport:0,misc:0,workingBuffer:0,transactions:[],paymentConfirmations:{},goals:[]};
let state=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast('Guardado neste dispositivo')}
const n=v=>Number(v)||0,eur=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n(v)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const month=d=>String(d||'').slice(0,7),currentMonth=()=>new Date().toISOString().slice(0,7),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const txkey=t=>t.import_id||[t.date,t.account,t.description,t.amount].join('|');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function transactions(){const m=new Map();for(const t of state.transactions||[]){if(!t||!/^\d{4}-\d{2}-\d{2}/.test(String(t.date||''))||!Number.isFinite(Number(t.amount)))continue;const k=txkey(t);if(!m.has(k))m.set(k,t)}return [...m.values()]}
function isTransfer(t){return t.category==='Transfer'||/TRANSFERENCIA ENTRE CONTAS|REVOLUT TOP UP|TRANSFER TO OWN/.test(norm(t.description))}
function isDebt(t){return t.category==='Debt payment'||/CREDIBOM|CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/.test(norm(t.description))}
function regularSalaryCandidates(){
 const seed=n(state.salary)||2096.22;
 return transactions().filter(t=>n(t.amount)>0&&/^T(F|R)I?\s+ASSOCIACAO\s+RAEGE$/.test(norm(t.description).replace(/\s+/g,' ').trim())).filter(t=>{const a=n(t.amount);return a>=seed*.7&&a<=seed*1.35})
}
function isSalary(t){return regularSalaryCandidates().some(x=>txkey(x)===txkey(t))}
function monthlySpend(mm=currentMonth()){return transactions().filter(t=>month(t.date)===mm&&n(t.amount)<0&&!isTransfer(t)&&!isDebt(t)).reduce((a,t)=>a-n(t.amount),0)}
function salaryDetected(){const seed=n(state.salary)||2096.22,c=regularSalaryCandidates().filter(t=>month(t.date)===currentMonth());if(!c.length)return 0;return n(c.sort((a,b)=>Math.abs(n(a.amount)-seed)-Math.abs(n(b.amount)-seed))[0].amount)}
function paymentStatus(name,amount,re){const mm=currentMonth(),manual=state.paymentConfirmations?.[mm]?.[name];const hits=transactions().filter(t=>month(t.date)===mm&&n(t.amount)<0&&re.test(norm(t.description))&&Math.abs(-n(t.amount)-amount)<=1);return {name,amount,detected:hits.length>0||!!manual,bank:hits.length>0,manual:!hits.length&&!!manual}}
function paymentStatuses(){return [paymentStatus('Credibom',n(state.carRegular)||210.74,/CREDIBOM/),paymentStatus('Caixa Classic',n(state.cardRegular)||231.25,/CAIXA CLASSIC|PAGAMENTO CARTAO|PAG CARTAO|CARTAO CREDITO/)]}
function budgetTotal(){return n(state.food)+n(state.transport)+n(state.meo)+n(state.bankSubs)+n(state.misc)}
function migrateGoal(){if((state.goals||[]).length===0&&n(state.scooterTarget)>0){state.goals=[{id:'legacy-scooter',name:'Trotinete',target:n(state.scooterTarget),saved:n(state.scooter)}];save()}}
migrateGoal();
const metric=(a,b,c='')=>'<div class="card metric"><small>'+a+'</small><strong>'+b+'</strong><span class="muted">'+c+'</span></div>';
const row=(a,b)=>'<div class="row"><span>'+a+'</span><strong>'+b+'</strong></div>';
const field=(key,label,value,step='.01')=>'<label>'+label+'<input data-field="'+key+'" type="number" step="'+step+'" value="'+n(value)+'"></label>';
function renderOverview(){
 const spent=monthlySpend(),budget=budgetTotal(),salary=salaryDetected(),payments=paymentStatuses(),pending=payments.reduce((a,p)=>a+(p.detected?0:p.amount),0),available=n(state.balance)-n(state.reserve)-pending,age=state.bankSync?.generated_at?Math.floor((Date.now()-new Date(state.bankSync.generated_at))/86400000):null;
 document.getElementById('overview').innerHTML='<div class="grid">'+metric('Saldo disponível',eur(state.balance),state.balanceDate?'Atualizado '+esc(state.balanceDate):'Saldo de referência')+metric('Reserva protegida',eur(state.reserve),'Objetivo de emergência')+metric('Orçamento usado',budget?pct(spent/budget):'—',eur(spent)+' de '+eur(budget))+metric('Disponível acima da reserva',eur(available),'Após prestações ainda não identificadas')+'</div>'+
 '<div class="card status '+(age===null||age>2?'':'ok')+'"><h2>Estado dos dados</h2>'+row('Sincronização bancária',age===null?'⚪ Sem importação confirmada':age<=2?'🟢 '+age+' dia(s)':'🟠 '+age+' dias')+row('Salário deste mês',salary>0?'🟢 Detetado · '+eur(salary):'⚪ Não detetado')+'</div>'+
 '<div class="card"><h2>Pagamentos</h2>'+payments.map(p=>row(esc(p.name),p.bank?'🟢 Movimento identificado':p.manual?'🟢 Confirmado manualmente':'🟠 Não identificado')+'<div style="margin-top:8px"><button class="action" data-pay="'+esc(p.name)+'">'+(p.manual?'Anular confirmação':p.detected?'Confirmado':'Confirmar pagamento')+'</button></div>').join('')+'</div>'+
 '<div class="card"><h2>Próxima decisão</h2><p>Para análise de património, amortização antecipada e projeções, usa a Financial Intelligence v7.</p><a class="button primary" href="./financial-intelligence.html">Abrir Intelligence v7 →</a></div>';
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>togglePayment(b.dataset.pay));
}
const pct=v=>(100*v).toFixed(1)+'%';
function renderBudget(){document.getElementById('budget').innerHTML='<div class="card"><h2>Orçamento mensal</h2><div class="grid">'+field('food','Alimentação (€)',state.food)+field('transport','Transportes (€)',state.transport)+field('meo','Comunicações (€)',state.meo)+field('bankSubs','Serviços bancários (€)',state.bankSubs)+field('misc','Outros (€)',state.misc)+'</div><button class="action" id="saveBudget">Guardar orçamento</button></div><div class="card">'+row('Total planeado',eur(budgetTotal()))+row('Gasto classificado este mês',eur(monthlySpend()))+row('Execução',budgetTotal()?pct(monthlySpend()/budgetTotal()):'—')+'</div>';bindFields();document.getElementById('saveBudget').onclick=()=>{save();renderAll()}}
function renderDebts(){
 const goals=state.goals||[],car=state.debtEstimates?.car,card=state.debtEstimates?.card;
 document.getElementById('debts').innerHTML='<div class="card"><h2>Dívidas</h2>'+
 row('Credibom · saldo estimado',car?eur(car.balance)+' · automático':'⚪ Sem referência calibrada · '+eur(state.carBalance))+
 row('Credibom · pagamentos identificados',car?car.matches+' · '+eur(car.payments):'—')+
 row('Credibom · atualizado até',car?esc(car.asOf):'—')+
 row('Caixa Classic · saldo estimado',card?eur(card.balance)+' · automático':'⚪ Sem referência calibrada · '+eur(state.cardBalance))+
 row('Caixa Classic · pagamentos identificados',card?card.matches+' · '+eur(card.payments):'—')+
 row('Caixa Classic · atualizado até',card?esc(card.asOf):'—')+
 '<div class="grid">'+field('carAPR','Credibom · taxa anual (%)',state.carAPR)+field('carRegular','Credibom · prestação (€)',state.carRegular)+field('cardAPR','Caixa Classic · taxa anual (%)',state.cardAPR)+field('cardRegular','Caixa Classic · pagamento mensal (€)',state.cardRegular)+'</div><button class="action" id="saveDebts">Guardar taxas/prestações</button> <a class="button primary" href="./bank-accounts.html">Calibrar saldos em Accounts →</a><p class="muted">Os saldos são recalculados a partir da referência calibrada e dos pagamentos identificados nos ficheiros .mfc. Para Caixa Classic, compras novas podem aumentar a dívida e não são inferidas automaticamente a partir do limite disponível.</p></div>'+
 '<div class="card"><h2>Objetivos</h2>'+ (goals.length?goals.map((g,i)=>'<div class="row"><span><input data-goal-name="'+i+'" value="'+esc(g.name)+'" aria-label="Nome do objetivo"></span><span><input data-goal-saved="'+i+'" type="number" step=".01" value="'+n(g.saved)+'" aria-label="Valor reservado"></span><span><input data-goal-target="'+i+'" type="number" step=".01" value="'+n(g.target)+'" aria-label="Meta"></span><button class="action danger" data-goal-remove="'+i+'">Remover</button></div>').join(''):'<p class="muted">Sem objetivos ativos.</p>')+'<button class="action" id="addGoal">Adicionar objetivo</button> <button class="action" id="saveGoals">Guardar objetivos</button></div>';
 bindFields();document.getElementById('saveDebts').onclick=()=>{save();renderAll()};document.getElementById('addGoal').onclick=()=>{state.goals=[...(state.goals||[]),{id:'g'+Date.now(),name:'Novo objetivo',saved:0,target:0}];save();renderAll()};document.getElementById('saveGoals').onclick=saveGoals;document.querySelectorAll('[data-goal-remove]').forEach(b=>b.onclick=()=>{state.goals.splice(Number(b.dataset.goalRemove),1);save();renderAll()});
}
function saveGoals(){document.querySelectorAll('[data-goal-name]').forEach(e=>state.goals[+e.dataset.goalName].name=e.value.trim()||'Objetivo');document.querySelectorAll('[data-goal-saved]').forEach(e=>state.goals[+e.dataset.goalSaved].saved=n(e.value));document.querySelectorAll('[data-goal-target]').forEach(e=>state.goals[+e.dataset.goalTarget].target=n(e.value));save();renderAll()}
function renderTransactions(){
 const list=transactions().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,100);
 document.getElementById('transactions').innerHTML='<div class="card"><h2>Ajuste manual</h2><p class="muted">Usa apenas para dinheiro, correções ou movimentos que não chegam pela importação bancária.</p><div class="grid"><label>Data<input id="txDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Descrição<input id="txDesc" type="text"></label><label>Valor (€; negativo = despesa)<input id="txAmount" type="number" step=".01"></label></div><button class="action" id="addTx">Adicionar ajuste</button></div><div class="card"><h2>Movimentos recentes</h2><div class="scroll"><table><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Origem</th></tr></thead><tbody>'+list.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.description||'')+'</td><td>'+eur(t.amount)+'</td><td>'+(t.import_id?'Banco':'Manual')+'</td></tr>').join('')+'</tbody></table></div></div>';
 document.getElementById('addTx').onclick=()=>{const date=document.getElementById('txDate').value,description=document.getElementById('txDesc').value.trim(),amount=Number(document.getElementById('txAmount').value);if(!date||!description||!Number.isFinite(amount))return toast('Preenche data, descrição e valor');state.transactions=[...(state.transactions||[]),{date,description,amount,category:'Manual'}];save();renderAll()};
}
function renderSettings(){
 document.getElementById('settings').innerHTML='<div class="card"><h2>Configuração essencial</h2><div class="grid">'+field('reserve','Reserva de emergência (€)',state.reserve)+field('workingBuffer','Margem de segurança (€)',state.workingBuffer)+'</div><p class="muted">O rendimento mensal é agora inferido automaticamente dos movimentos bancários classificados como salário.</p><button class="action" id="saveSettings">Guardar</button></div>'+
 '<div class="card"><h2>Dados e segurança</h2><button class="action" id="exportJson">Exportar backup JSON</button><p class="muted">Para backup encriptado e auditoria usa Intelligence v7.</p><details><summary>Advanced · manutenção de dados</summary><p class="muted">Utiliza apenas se souberes exatamente o que estás a fazer.</p><button class="action danger" id="clearImported">Remover movimentos bancários importados deste dispositivo</button></details></div>';
 bindFields();document.getElementById('saveSettings').onclick=()=>{save();renderAll()};document.getElementById('exportJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-finance-control-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('clearImported').onclick=()=>{if(!confirm('Remover apenas os movimentos bancários importados deste dispositivo? Ajustes manuais serão preservados.'))return;state.transactions=(state.transactions||[]).filter(t=>!t.import_id);delete state.bankSync;save();renderAll()};
}
function bindFields(){document.querySelectorAll('[data-field]').forEach(e=>e.onchange=()=>{state[e.dataset.field]=n(e.value)})}
function togglePayment(name){const mm=currentMonth();state.paymentConfirmations=state.paymentConfirmations||{};state.paymentConfirmations[mm]=state.paymentConfirmations[mm]||{};if(state.paymentConfirmations[mm][name])delete state.paymentConfirmations[mm][name];else state.paymentConfirmations[mm][name]={amount:name==='Credibom'?n(state.carRegular)||210.74:n(state.cardRegular)||231.25,confirmedAt:new Date().toISOString()};save();renderAll()}
function renderAll(){state=load();renderOverview();renderBudget();renderDebts();renderTransactions();renderSettings()}
document.getElementById('tabs').querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hide'));document.getElementById(b.dataset.tab).classList.remove('hide');document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
renderAll();window.addEventListener('pageshow',renderAll);window.addEventListener('focus',renderAll);document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderAll()});window.addEventListener('storage',e=>{if(e.key===KEY)renderAll()});
</script></body></html>
